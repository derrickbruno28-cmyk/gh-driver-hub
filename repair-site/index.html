/* authDomain is this site's own domain so the Google sign-in popup runs on

/* ---- window.storage shim: shared -> Firestore, personal -> localStorage ---- */
window.storage = {
  get: async function(key, shared){
    if (!shared){
      var v = localStorage.getItem('repair-' + key);
      return v == null ? null : { value: v };
    }
    var snap = await db.collection('repairBoard').doc(key).get();
    if (!snap.exists) return null;
    var d = snap.data();
    return d && typeof d.value === 'string' ? { value: d.value } : null;
  },
  set: async function(key, value, shared){
    if (!shared){
      localStorage.setItem('repair-' + key, value);
      return;
    }
    await db.collection('repairBoard').doc(key).set({
      value: value,
      updatedAt: new Date().toISOString(),
      by: currentUser ? currentUser.email : ''
    });
  }
};

/* ---- file uploads: invoices, photos, videos -> Firebase Storage ----
   Only the download URL is kept in the board document, so the board stays
   small no matter how many files pile up. Files land under driverDocs/
   (the same top-level folder the Driver Hub already uploads to, so the
   existing Storage security rules cover them). */
var storageSvc = null;
try { storageSvc = firebase.storage(); } catch (e) { storageSvc = null; }

window.uploadRepairFile = function(file, onProgress){
  return new Promise(function(resolve, reject){
    if (!storageSvc) return reject(new Error('Cloud file storage unavailable'));
    var safe = String(file.name).replace(/[^\w.\-]+/g, '_');
    var path = 'driverDocs/repair_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8) + '_' + safe;
    var task = storageSvc.ref().child(path).put(file);
    task.on('state_changed', function(snap){
      if (onProgress && snap.totalBytes) onProgress(Math.round(snap.bytesTransferred / snap.totalBytes * 100));
    }, reject, function(){
      task.snapshot.ref.getDownloadURL().then(function(url){
        resolve({ url: url, path: path, name: file.name, size: file.size, mime: file.type });
      }, reject);
    });
  });
};
window.deleteRepairFile = function(path){
  if (!storageSvc || !path) return Promise.resolve();
  return storageSvc.ref().child(path).delete().catch(function(){ /* already gone */ });
};

/* ---- outgoing mail ----
   A static page can't send email itself. This writes a document to the
   `mail` collection, which is the exact format the Firebase extension
   "Trigger Email from Firestore" watches — it picks the doc up and sends
   it. Until that extension is installed the docs just queue up harmlessly
   and no mail goes out. Setup steps are in EMAIL-SETUP.md at the repo root. */
window.queueEmail = function(to, subject, html, text){
  return db.collection('mail').add({
    to: to,
    message: { subject: subject, html: html, text: text || '' },
    queuedAt: new Date().toISOString(),
    queuedBy: currentUser ? currentUser.email : ''
  });
};

/* ---- reading a total off an invoice ----
   Two paths, both entirely in the browser (no API keys, no billing):
     * PDF   -> pdf.js pulls the real text layer. Near-perfect on an
                invoice a shop emailed as a PDF.
     * image -> tesseract.js OCRs it. Good on a flat, well-lit receipt,
                shaky on a crumpled one shot at an angle.
   Either way a person confirms the number before it counts — this saves
   typing, it is never the last word. Libraries load on first use so
   nobody pays the download unless they actually attach an invoice. */
var _libs = {};
function loadScript(url, globalName){
  if (_libs[url]) return _libs[url];
  _libs[url] = new Promise(function(res, rej){
    var s = document.createElement('script');
    s.src = url;
    s.onload = function(){ res(window[globalName]); };
    s.onerror = function(){ rej(new Error('could not load ' + url)); };
    document.head.appendChild(s);
  });
  return _libs[url];
}

/* Pick the most total-like number in the text: prefer a figure sitting
   next to a total-ish word, else the largest amount seen — on a receipt
   that is nearly always the total. */
function pickTotal(text){
  if (!text) return 0;
  var flat = String(text).replace(/\r/g, '').replace(/[ \t]+/g, ' ');
  var money = '\\$?\\s*([0-9][0-9,]*\\.[0-9]{2})';
  var best = 0;
  [
    new RegExp('(?:grand |invoice |amount )?total\\s*(?:due|amount)?\\s*:?\\s*' + money, 'ig'),
    new RegExp('balance\\s*(?:due)?\\s*:?\\s*' + money, 'ig'),
    new RegExp('amount\\s*due\\s*:?\\s*' + money, 'ig')
  ].forEach(function(re){
    var m;
    while ((m = re.exec(flat)) !== null) {
      var v = parseFloat(m[1].replace(/,/g, ''));
      /* later matches win — "total" often precedes "grand total" */
      if (isFinite(v) && v > 0) best = v;
    }
  });
  if (best > 0) return best;
  (flat.match(new RegExp(money, 'g')) || []).forEach(function(t){
    var v = parseFloat(t.replace(/[^0-9.]/g, ''));
    if (isFinite(v) && v > best) best = v;
  });
  return best;
}

window.readInvoiceTotal = async function(file, onStage){
  try {
    if (/pdf$/i.test(file.type) || /\.pdf$/i.test(file.name)) {
      if (onStage) onStage('Reading the PDF…');
      var pdfjs = await loadScript('https://unpkg.com/pdfjs-dist@3.11.174/build/pdf.min.js', 'pdfjsLib');
      pdfjs.GlobalWorkerOptions.workerSrc = 'https://unpkg.com/pdfjs-dist@3.11.174/build/pdf.worker.min.js';
      var doc = await pdfjs.getDocument({ data: await file.arrayBuffer() }).promise;
      var text = '';
      for (var i = 1; i <= Math.min(doc.numPages, 5); i++) {
        var content = await (await doc.getPage(i)).getTextContent();
        text += content.items.map(function(it){ return it.str; }).join(' ') + '\n';
      }
      return pickTotal(text);
    }
    if (!/^image\//i.test(file.type)) return 0;
    if (onStage) onStage('Reading the receipt…');
    var T = await loadScript('https://unpkg.com/tesseract.js@5.1.0/dist/tesseract.min.js', 'Tesseract');
    var out = await T.recognize(file, 'eng', {
      logger: function(m){
        if (onStage && m.status === 'recognizing text') {
          onStage('Reading the receipt… ' + Math.round((m.progress || 0) * 100) + '%');
        }
      }
    });
    return pickTotal(out && out.data && out.data.text);
  } catch (e) {
    console.warn('invoice read failed', e);
    return 0;
  }
};

  const past = ms < 0;

      ? h + "h " + String(m).padStart(2, "0") + "m"
      : m + ":" + String(ss).padStart(2, "0");

const STATUS_SEED = 3;
function mergeStatuses(stored) {
  const list = Array.isArray(stored) && stored.length ? [...stored] : [...DEFAULT_STATUSES];
  DEFAULT_STATUSES.forEach((d, i) => {

}

  };
};

/* ---------------------------- time helpers ------------------------- */

const hoursSince = (iso) => (Date.now() - new Date(iso).getTime()) / 3600e3;

function elapsed(iso) {
  const h = hoursSince(iso);
  if (h < 1) return Math.max(1, Math.round(h * 60)) + "m";
  if (h < 48) return Math.floor(h) + "h";
  const d = Math.floor(h / 24);
  return d + "d " + Math.floor(h - d * 24) + "h";
}

function stamp(iso) {
  const d = new Date(iso);
  return (
    d.toLocaleDateString([], { month: "short", day: "numeric" }) +
    " " +
    d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" })
  );
}
/* date only — reported dates don't track the time of day */
const stampDate = (iso) => new Date(iso).toLocaleDateString([], { month: "short", day: "numeric" });
/* normalised unit number, for duplicate detection */
const unitKey = (r) => String(r.unitNumber || "").trim().toUpperCase();

const toLocalInput = (iso) => {
  const d = new Date(iso);
  const p = (n) => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`;
};

const lastTouch = (r) => (r.followUps && r.followUps.length ? r.followUps[r.followUps.length - 1].at : r.reportedAt);
const touchBand = (r) => {
  if (isParked(r)) return "ok";
  const h = hoursSince(lastTouch(r));
  if (h >= 48) return "red";
  if (h >= 24) return "amber";
  return "ok";
};

/* --------------------------- alarm engine -------------------------- */

let audioCtx = null;
function armAudio() {
  try {
    if (!audioCtx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) audioCtx = new AC();
    }
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
  } catch (e) {
    audioCtx = null;
  }
}
function chime() {
  if (!audioCtx) return;
  try {
    const t0 = audioCtx.currentTime;
    [0, 0.26, 0.52].forEach((off, i) => {
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type = "triangle";
      o.frequency.value = i === 2 ? 784 : 988;
      g.gain.setValueAtTime(0.0001, t0 + off);
      g.gain.exponentialRampToValueAtTime(0.16, t0 + off + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + off + 0.22);
      o.connect(g).connect(audioCtx.destination);
      o.start(t0 + off);
      o.stop(t0 + off + 0.24);
    });
  } catch (e) {
    /* audio unavailable */
  }
}

/* ============================== app ============================== */

function RepairBoard() {
  const [data, setData] = useState({ repairs: [], archive: [], vendors: [], statuses: DEFAULT_STATUSES, rev: 0 });
  const [ready, setReady] = useState(false);
  const [saveState, setSaveState] = useState("idle");
  const [city, setCity] = useState("All");
  const [kind, setKind] = useState("All");
  const [own, setOwn] = useState("All");
  const [whose, setWhose] = useState("All");
  const [q, setQ] = useState("");
  const [open, setOpen] = useState(null); // expanded repair id
  const [showParked, setShowParked] = useState(true);
  const [shut, setShut] = useState({});
  const [modal, setModal] = useState(null); // 'add' | 'vendors' | 'statuses' | 'archive' | 'csv'
  const [prefs, setPrefs] = useState({ sound: true, defaultMinutes: 30, name: "" });
  const [notice, setNotice] = useState(null); // transient banner
  const [page, setPage] = useState("board"); // 'board' | 'repaired'
  const [, tick] = useState(0);
  const ref = useRef(data);
  ref.current = data;

  /* the notice banner clears itself, but stays long enough to click through */
  useEffect(() => {
    if (!notice) return;
    const t = setTimeout(() => setNotice(null), 12000);
    return () => clearTimeout(t);
  }, [notice]);

  /* one-second clock: live countdowns and aging */
  useEffect(() => {
    const i = setInterval(() => tick((n) => n + 1), 1000);
    return () => clearInterval(i);
  }, []);

  /* first gesture unlocks the alarm sound */
  useEffect(() => {
    const on = () => armAudio();
    window.addEventListener("pointerdown", on, { once: true });
    window.addEventListener("keydown", on, { once: true });
    return () => {
      window.removeEventListener("pointerdown", on);
      window.removeEventListener("keydown", on);
    };
  }, []);

  /* personal alarm prefs (not shared with the team) */
  useEffect(() => {
    (async () => {
      try {
        const r = await window.storage.get(PREFS_KEY, false);
        if (r && r.value) setPrefs((p) => ({ ...p, ...JSON.parse(r.value) }));
      } catch (e) {
        /* defaults */
      }
    })();
  }, []);
  const savePrefs = (patch) => {
    setPrefs((p) => {
      const next = { ...p, ...patch };
      window.storage.set(PREFS_KEY, JSON.stringify(next), false).catch(() => {});
      return next;
    });
  };

  /* personal view — saved with your prefs, so it's per person and per
     machine rather than something one person turns on for everybody */
  const mine = !!prefs.mine && !!prefs.name;
  const toggleMine = () => (prefs.name ? savePrefs({ mine: !prefs.mine }) : setModal("me"));

  /* Snoozing and silencing are yours alone — they live in your prefs, not
     on the shared record, so pushing a unit off your screen leaves it on
     everyone else's. Each entry remembers which reminder it answered
     (forDueAt); the moment someone reschedules the unit, your snooze
     stops applying and it can alarm again. */
  const alarmPrefs = prefs.alarms || {};
  const setAlarmPref = (id, patch, dueAt) => {
    const next = { ...alarmPrefs, [id]: { ...(alarmPrefs[id] || {}), ...patch, forDueAt: dueAt || "" } };
    /* keep the map from growing forever */
    const cutoff = Date.now() - 7 * 864e5;
    Object.keys(next).forEach((k) => {
      const t = new Date(next[k].forDueAt || 0).getTime();
      if (isFinite(t) && t && t < cutoff) delete next[k];
    });
    savePrefs({ alarms: next });
  };
  /* a personal entry only counts while it still matches the unit's current
     reminder time */
  const myAlarm = (r) => {
    const a = alarmPrefs[r.id];
    return a && a.forDueAt === r.dueAt ? a : null;
  };
  const snoozedByMe = (r) => {
    const a = myAlarm(r);
    return !!(a && a.until && new Date(a.until).getTime() > Date.now());
  };
  const ackedByMe = (r) => !!(myAlarm(r) || {}).ack;
  const mySnooze = (id, minutes, dueAt) => setAlarmPref(id, { until: inMinutes(minutes), ack: true }, dueAt);
  const mySilence = (id, dueAt) => setAlarmPref(id, { ack: true }, dueAt);

  /* load */
  useEffect(() => {
    (async () => {
      let loaded = null;
      try {
        const r = await window.storage.get(KEY, true);
        if (r && r.value) loaded = JSON.parse(r.value);
      } catch (e) {
        /* no board yet */
      }
      if (loaded && loaded.repairs) {
        const merged = { archive: [], statuses: DEFAULT_STATUSES, rev: 0, ...loaded };
        if ((merged.statusSeed || 0) < STATUS_SEED) {
          merged.statuses = mergeStatuses(merged.statuses);
          merged.statusSeed = STATUS_SEED;
        }
        setData(merged);
      } else {
        const d = DEMO();
        setData({ repairs: d.repairs, vendors: d.vendors, archive: [], statuses: DEFAULT_STATUSES, statusSeed: STATUS_SEED, rev: 0 });
      }
      setReady(true);
    })();
  }, []);

  /* save */
  const commit = useCallback((fn) => {
    const prev = ref.current;
    const next = typeof fn === "function" ? fn(prev) : fn;
    const payload = { ...next, rev: (prev.rev || 0) + 1, updatedAt: nowISO() };
    ref.current = payload;
    setData(payload);
    setSaveState("saving");
    (async () => {
      try {
        await window.storage.set(KEY, JSON.stringify(payload), true);
        setSaveState("saved");
        setTimeout(() => setSaveState("idle"), 1400);
      } catch (e) {
        setSaveState("error");
      }
    })();
  }, []);

  /* pull teammates' changes */
  const sync = useCallback(async () => {
    try {
      const r = await window.storage.get(KEY, true);
      if (r && r.value) {
        const remote = JSON.parse(r.value);
        if ((remote.rev || 0) > (ref.current.rev || 0)) {
          setData({ archive: [], statuses: DEFAULT_STATUSES, ...remote });
        }
      }
    } catch (e) {
      /* ignore */
    }
  }, []);

  useEffect(() => {
    if (!ready) return;
    const i = setInterval(sync, 15000);
    return () => clearInterval(i);
  }, [ready, sync]);

  const { repairs, vendors, statuses, archive } = data;
  const statusOf = (id) => statuses.find((s) => s.id === id) || { label: "Unassigned", tone: "neutral" };
  const vendorOf = (id) => vendors.find((v) => v.id === id) || { name: "Pending shop — not decided yet", city: "" };

  /* in the personal view every list and tally is about your units, not the
     fleet's — declared here so the lists below can all lean on it */
  const scoped = useMemo(
    () => (mine ? repairs.filter((r) => isMine(r, prefs.name)) : repairs),
    [repairs, mine, prefs.name]
  );

  /* filtering */
  const visible = useMemo(() => {
    const needle = q.trim().toLowerCase();
    return repairs.filter((r) => {
      /* parked units stay off the active board — but a search still finds them */
      if (!needle && isParked(r)) return false;
      if (city !== "All" && r.city !== city) return false;
      if (kind !== "All" && r.unitType !== kind) return false;
      /* personal view: only what this person has claimed. Kept separate from
         the "whose" dropdown so it survives filter fiddling. */
      if (mine && !isMine(r, prefs.name)) return false;
      if (own === "Partner" && !onPartner(r)) return false;
      if (own !== "All" && own !== "Partner" && (!tracksOwnership(r) || ownOf(r) !== own)) return false;
      if (whose === "Mine" && !isMine(r, prefs.name)) return false;
      if (whose === "Free" && claimedBy(r)) return false;
      if (whose !== "All" && whose !== "Mine" && whose !== "Free" && claimedBy(r) !== whose) return false;
      if (!needle) return true;
      const hay = [r.unitNumber, r.issue, r.lessor, r.location, vendorOf(r.vendorId).name, statusOf(r.statusId).label]
        .join(" ")
        .toLowerCase();
      return hay.includes(needle);
    });
  }, [repairs, city, kind, own, whose, q, mine, prefs.name, vendors, statuses, Math.floor(Date.now() / 30000)]);

  const freshList = useMemo(
    () => visible.filter(isNew).sort((a, b) => new Date(b.reportedAt) - new Date(a.reportedAt)),
    [visible]
  );
  const workedList = useMemo(() => visible.filter((r) => !isNew(r)), [visible]);

  const parkedList = useMemo(
    () => scoped.filter(isParked).sort((a, b) => new Date(a.dueAt) - new Date(b.dueAt)),
    [scoped, Math.floor(Date.now() / 1000)]
  );

  const counts = useMemo(() => {
    const c = { open: scoped.length, active: 0, mine: 0, free: 0, truck: 0, trailer: 0, stale: 0, overdue: 0, hire: 0, partner: 0, capFlag: 0 };
    scoped.forEach((r) => {
      if (r.unitType === "Trailer") c.trailer++;
      else c.truck++;
      if (onHire(r)) c.hire++;
      if (onPartner(r)) c.partner++;
      if (partnerFlagged(r)) c.capFlag++;
      if (!isParked(r)) {
        c.active++;
        if (isMine(r, prefs.name)) c.mine++;
        if (!claimedBy(r)) c.free++;
      }
      const b = touchBand(r);
      if (b === "amber") c.stale++;
      if (b === "red") c.overdue++;
    });
    CITIES.forEach((ct) => (c[ct] = scoped.filter((r) => r.city === ct && !isParked(r)).length));
    c[OTR] = scoped.filter((r) => r.city === OTR && !isParked(r)).length;
    return c;
  }, [scoped, prefs.name, Math.floor(Date.now() / 30000)]);

  /* duplicate tracker — same unit number on the board more than once
     (parked units count too; someone may have re-reported a parked unit) */
  const dupUnits = useMemo(() => {
    const seen = {};
    repairs.forEach((r) => {
      const k = unitKey(r);
      if (k) seen[k] = (seen[k] || 0) + 1;
    });
    return new Set(Object.keys(seen).filter((k) => seen[k] > 1));
  }, [repairs]);
  const dupCount = useMemo(() => repairs.filter((r) => dupUnits.has(unitKey(r))).length, [repairs, dupUnits]);

  /* closed-out repairs still waiting on paperwork */
  const shortPaperwork = useMemo(() => archive.filter((r) => !paperworkComplete(r)).length, [archive]);

  /* mutations */
  const addRepair = (r) => commit((p) => ({ ...p, repairs: [...p.repairs, r] }));
  const patchRepair = (id, patch) =>
    /* accepts a plain object, or a function of the current repair — the
       function form is what file uploads use so parallel patches can't
       clobber each other */
    commit((p) => ({
      ...p,
      repairs: p.repairs.map((r) => (r.id === id ? { ...r, ...(typeof patch === "function" ? patch(r) : patch) } : r)),
    }));
  /* fix up or drop an existing follow-up note — updates come in all day,
     and a mistyped time or wrong ETA shouldn't live on the record forever */
  const editFollowUp = (id, idx, note) =>
    commit((p) => ({
      ...p,
      repairs: p.repairs.map((r) =>
        r.id === id
          ? { ...r, followUps: (r.followUps || []).map((f, i) => (i === idx ? { ...f, note, editedAt: nowISO() } : f)) }
          : r
      ),
    }));
  const deleteFollowUp = (id, idx) =>
    commit((p) => ({
      ...p,
      repairs: p.repairs.map((r) =>
        r.id === id ? { ...r, followUps: (r.followUps || []).filter((f, i) => i !== idx) } : r
      ),
    }));
  const logFollowUp = (id, note, nextMinutes) =>
    commit((p) => ({
      ...p,
      repairs: p.repairs.map((r) =>
        r.id === id
          ? {
              ...r,
              followUps: [...(r.followUps || []), { at: nowISO(), note: note || "Checked in with shop." }],
              dueAt: nextMinutes ? inMinutes(nextMinutes) : null,
              parked: false,
              dueAck: false,
            }
          : r
      ),
    }));
  const applySet = (r, s) => {
    if (!s || s.clear) return { ...r, dueAt: null, parked: false, dueAck: false };
    if (s.at) return { ...r, dueAt: s.at, parked: !!s.park, dueAck: false };
    /* remember the interval so the unit can be re-timed in one click */
    if (s.minutes) return { ...r, dueAt: inMinutes(s.minutes), lastMinutes: s.minutes, parked: false, dueAck: false };
    return { ...r, dueAt: null, parked: false, dueAck: false };
  };
  const setTimer = (id, s) =>
    commit((p) => ({ ...p, repairs: p.repairs.map((r) => (r.id === id ? applySet(r, s) : r)) }));
  const setShopTimer = (vendorId, s) =>
    commit((p) => ({ ...p, repairs: p.repairs.map((r) => (r.vendorId === vendorId ? applySet(r, s) : r)) }));
  const unpark = (id) =>
    commit((p) => ({ ...p, repairs: p.repairs.map((r) => (r.id === id ? { ...r, parked: false } : r)) }));

  /* the roster lives in the shared board data, so a name added by one person
     is available to everyone; prefs.name is just which of them you are */
  const addTeamMember = (n) =>
    commit((p) => {
      const name = (n || "").trim();
      if (!name) return p;
      const team = p.team || [];
      if (team.some((t) => t.toLowerCase() === name.toLowerCase())) return p;
      return { ...p, team: [...team, name].sort((a, b) => a.localeCompare(b)) };
    });
  const removeTeamMember = (n) =>
    commit((p) => ({ ...p, team: (p.team || []).filter((t) => t !== n) }));

  const claim = (id, who) =>
    commit((p) => ({
      ...p,
      repairs: p.repairs.map((r) => (r.id === id ? { ...r, claimedBy: who, claimedAt: nowISO() } : r)),
    }));
  const release = (id) =>
    commit((p) => ({ ...p, repairs: p.repairs.map((r) => (r.id === id ? { ...r, claimedBy: "", claimedAt: "" } : r)) }));
  const claimShop = (vendorId, who) =>
    commit((p) => ({
      ...p,
      repairs: p.repairs.map((r) =>
        r.vendorId === vendorId && !claimedBy(r) ? { ...r, claimedBy: who, claimedAt: nowISO() } : r
      ),
    }));

  const markSeen = (id) =>
    commit((p) => ({ ...p, repairs: p.repairs.map((r) => (r.id === id ? { ...r, seenAt: nowISO() } : r)) }));
  const markAllSeen = (ids) =>
    commit((p) => ({ ...p, repairs: p.repairs.map((r) => (ids.includes(r.id) ? { ...r, seenAt: nowISO() } : r)) }));

  /* silences your own alarms only — never touches the shared record */
  const silenceAll = (list) => {
    const next = { ...(prefs.alarms || {}) };
    list.forEach((r) => {
      next[r.id] = { ...(next[r.id] || {}), ack: true, forDueAt: r.dueAt || "" };
    });
    savePrefs({ alarms: next });
  };
  const closeRepair = (id, note) =>
    commit((p) => {
      const r = p.repairs.find((x) => x.id === id);
      if (!r) return p;
      return {
        ...p,
        repairs: p.repairs.filter((x) => x.id !== id),
        archive: [{ ...r, repairedAt: nowISO(), closeNote: note || "" }, ...p.archive].slice(0, 400),
      };
    });
  const restore = (id) =>
    commit((p) => {
      const r = p.archive.find((x) => x.id === id);
      if (!r) return p;
      const { repairedAt, closeNote, ...rest } = r;
      return { ...p, archive: p.archive.filter((x) => x.id !== id), repairs: [...p.repairs, rest] };
    });
  const purge = (id) => commit((p) => ({ ...p, archive: p.archive.filter((x) => x.id !== id) }));
  /* paperwork keeps arriving after a unit is closed out, so archived
     records stay editable */
  const patchArchive = (id, patch) =>
    commit((p) => ({
      ...p,
      archive: p.archive.map((r) => (r.id === id ? { ...r, ...(typeof patch === "function" ? patch(r) : patch) } : r)),
    }));
  /* delete outright — for duplicates and mis-entries that were never real
     repairs, so they don't pollute the Repaired history */
  const removeRepair = (id) => {
    const gone = ref.current.repairs.find((r) => r.id === id);
    ((gone && gone.files) || []).forEach((f) => f.path && window.deleteRepairFile(f.path));
    commit((p) => ({ ...p, repairs: p.repairs.filter((r) => r.id !== id) }));
  };
  const clearDemo = () =>
    commit((p) => {
      const kept = p.repairs.filter((r) => !r.demo);
      const demoVendorIds = new Set(p.repairs.filter((r) => r.demo).map((r) => r.vendorId));
      return {
        ...p,
        repairs: kept,
        vendors: p.vendors.filter((v) => !demoVendorIds.has(v.id) || kept.some((r) => r.vendorId === v.id)),
      };
    });

  /* Whose alarm is it? Only the person holding the unit gets nagged, so
     snoozing your own reminder doesn't wipe it off a teammate's screen.
     Unclaimed units still ring for everyone — nobody owns them, so
     nobody would hear them otherwise. Before you've set a name we can't
     tell who you are, so you see the lot. */
  const alarmsForMe = (r) => !prefs.name || isMine(r, prefs.name) || !claimedBy(r);
  const dueList = useMemo(
    () =>
      scoped
        .filter((r) => dueState(r) === "due" && alarmsForMe(r) && !snoozedByMe(r))
        .sort((a, b) => new Date(a.dueAt) - new Date(b.dueAt)),
    [scoped, prefs.name, prefs.alarms, Math.floor(Date.now() / 1000)]
  );
  const ringing = dueList.filter((r) => !ackedByMe(r));

  const claimants = useMemo(() => {
    const all = [...(data.team || []), ...repairs.map(claimedBy)].filter(Boolean);
    const seen = new Map();
    all.forEach((n) => { if (!seen.has(n.toLowerCase())) seen.set(n.toLowerCase(), n); });
    return [...seen.values()].sort((a, b) => a.localeCompare(b));
  }, [data.team, repairs]);


  /* re-chime every 20s while something is unacknowledged */
  const lastChime = useRef(0);
  useEffect(() => {
    if (!prefs.sound || ringing.length === 0) return;
    const now = Date.now();
    if (now - lastChime.current > 20000) {
      lastChime.current = now;
      armAudio();
      chime();
    }
  }, [ringing.length, prefs.sound, Math.floor(Date.now() / 1000)]);

  const rankRows = (list) =>
    [...list].sort((a, b) => {
      const ra = dueState(a) === "due" ? 0 : a.dueAt ? 1 : 2;
      const rb = dueState(b) === "due" ? 0 : b.dueAt ? 1 : 2;
      if (ra !== rb) return ra - rb;
      /* criticals float to the top of their shop */
      if (prioOf(a) !== prioOf(b)) return prioOf(a) - prioOf(b);
      if (ra === 1) return new Date(a.dueAt) - new Date(b.dueAt);
      return new Date(a.reportedAt) - new Date(b.reportedAt);
    });

  /* group a list of units by the shop holding them, ordered by city then shop name */
  const byShop = (list) => {
    const groups = {};
    list.forEach((r) => {
      (groups[r.vendorId] = groups[r.vendorId] || []).push(r);
    });
    return Object.keys(groups)
      .map((vid) => ({ vid, shop: vendorOf(vid), rows: rankRows(groups[vid]) }))
      .sort((a, b) =>
        a.shop.city === b.shop.city
          ? a.shop.name.localeCompare(b.shop.name)
          : LOCATIONS.indexOf(a.shop.city) - LOCATIONS.indexOf(b.shop.city)
      );
  };

  const rowProps = (r) => ({
    r,
    dup: dupUnits.has(unitKey(r)),
    status: statusOf(r.statusId),
    statuses,
    vendors,
    defaultMinutes: prefs.defaultMinutes,
    me: prefs.name,
    expanded: open === r.id,
    onToggle: () => setOpen(open === r.id ? null : r.id),
    onPatch: (patch) => patchRepair(r.id, patch),
    onNeedName: () => setModal("me"),
    onFollowUp: (n, next) => logFollowUp(r.id, n, next),
    onEditFollowUp: (i, n) => editFollowUp(r.id, i, n),
    onDeleteFollowUp: (i) => deleteFollowUp(r.id, i),
    onTimer: (m) => setTimer(r.id, m),
    onSilence: () => mySilence(r.id, r.dueAt),
    acked: ackedByMe(r),
    onClaim: (who) => claim(r.id, who),
    onRelease: () => release(r.id),
    team: claimants,
    onAddName: (n) => { addTeamMember(n); claim(r.id, n); },
    onClose: (n) => { closeRepair(r.id, n); setOpen(null); },
    onRemove: () => { removeRepair(r.id); setOpen(null); },
  });

  /* every hook must be called above this line — React requires the same
     number of hooks on every render, so the loading guard stays last */
  if (!ready) {
    return (
      <div className="fb">
        <style>{CSS}</style>
        <div className="mast">
          <div className="mast-top">
            <h1>Repair Board</h1>
          </div>
          <div className="stats" />
        </div>
        <div className="wrap">
          <div className="empty">Loading the board…</div>
        </div>
      </div>
    );
  }

  /* the personal view drops cities you have nothing in — that's most of
     the decluttering people are after */
  const shownCities = (city === "All" ? LOCATIONS : [city]).filter(
    (ct) => !mine || workedList.some((r) => r.city === ct)
  );
  const hasDemo = repairs.some((r) => r.demo);

  if (page === "repaired") {
    return (
      <div className="fb">
        <style>{CSS}</style>
        <header className="mast">
          <div className="mast-top">
            <h1>Repaired <span>Records</span></h1>
            <div className="live cond">
              <i className="dot" />
              {saveState === "saving" ? "Saving" : saveState === "error" ? "Save failed" : saveState === "saved" ? "Saved" : "Live"}
            </div>
            <div className="mast-actions">
              <button className="btn alt sm" onClick={() => setPage("board")}>← The board</button>
            </div>
          </div>
          <div className="stats">
            <div className="stat"><b>{archive.length}</b><s>Completed</s></div>
            <div className={"stat" + (shortPaperwork ? " bad" : "")}><b>{shortPaperwork}</b><s>Missing paperwork</s></div>
            <div className="stat"><b>{archive.length - shortPaperwork}</b><s>Fully documented</s></div>
          </div>
        </header>
        <div className="wrap">
          <RepairedPage
            archive={archive}
            vendors={vendors}
            me={prefs.name}
            onRestore={restore}
            onPurge={purge}
            onPatch={patchArchive}
            onBack={() => setPage("board")}
          />
        </div>
      </div>
    );
  }

  return (
    <div className={"fb" + (dueList.length ? " has-tray" : "")}>
      <style>{CSS}</style>

      {notice && (
        <div className={"notice-pop " + notice.kind} role="status">
          <span>{notice.msg}</span>
          {notice.href && (
            <a className="btn alt sm" href={notice.href} title="Opens your mail app with the message filled in">
              Send it myself
            </a>
          )}
          <button className="x" aria-label="Dismiss" onClick={() => setNotice(null)}>×</button>
        </div>
      )}

      <header className="mast">
        <div className="mast-top">
          <h1>
            {mine ? <>{prefs.name}'s <span>Units</span></> : <>Repair <span>Board</span></>}
          </h1>
          <div className="live cond">
            <i className="dot" />
            {saveState === "saving" ? "Saving" : saveState === "error" ? "Save failed" : saveState === "saved" ? "Saved" : "Live"}
          </div>
          <div className="mast-actions">
            <button
              className={"bell" + (prefs.sound ? "" : " off")}
              onClick={() => { armAudio(); if (!prefs.sound) chime(); savePrefs({ sound: !prefs.sound }); }}
              title={prefs.sound ? "Alarm sound on — click to mute" : "Alarm sound muted — click to turn on"}
            >
              {prefs.sound ? "🔔 Alarm on" : "🔕 Muted"}
            </button>
            <button
              className={"btn sm mine-tog" + (mine ? "" : " ghost")}
              aria-pressed={mine}
              onClick={toggleMine}
              title={
                mine
                  ? "Showing only units you've claimed — click for the whole board"
                  : "Show only the trucks and trailers you've claimed"
              }
            >
              {mine ? "👤 My units" : "👤 My units"}
            </button>
            <button className="btn ghost sm" onClick={sync}>Sync</button>
            <button className="bell" onClick={() => setModal("me")} title="Your name is stamped on claims and follow-ups">
              {prefs.name ? "👤 " + prefs.name : "👤 Set your name"}
            </button>
            <button className="btn ghost sm" onClick={() => setModal("vendors")}>Shops</button>
            <button className="btn ghost sm" onClick={() => setModal("statuses")}>Statuses</button>
            <button className="btn ghost sm" onClick={() => setPage("repaired")}>
              Repaired{archive.length ? " (" + archive.length + ")" : ""}
              {shortPaperwork > 0 && <span className="count-pill blink">{shortPaperwork}</span>}
            </button>
            <button className="btn ghost sm" onClick={() => setModal("csv")}>Export</button>
            <button className="btn alt sm" onClick={() => setModal("add")}>+ Report a unit down</button>
          </div>
        </div>
        <div className="stats">
          <div className={"stat" + (dueList.length ? " bad" : "")}><b>{dueList.length}</b><s>Follow up now</s></div>
          <div className={"stat" + (freshList.length ? " warn" : "")}><b>{freshList.length}</b><s>New</s></div>
          <div className="stat"><b>{counts.mine} / {counts.free}</b><s>Yours / unclaimed</s></div>
          <div className="stat"><b>{counts.active}</b><s>On the board</s></div>
          <div className="stat"><b>{parkedList.length}</b><s>Parked</s></div>
          <div className="stat"><b>{counts.truck} / {counts.trailer}</b><s>Trucks / trailers</s></div>
          <div className="stat"><b>{counts[OTR]}</b><s>On the road</s></div>
          <div className={"stat" + (dupCount ? " bad" : "")} title="Same unit number on the board more than once"><b>{dupCount}</b><s>Duplicates</s></div>
          <div className="stat"><b>{counts.hire}</b><s>Leased / rented</s></div>
          <div className="stat" title="Trailers down while out with a partner carrier"><b>{counts.partner}</b><s>With partners</s></div>
          <div className={"stat" + (counts.capFlag ? " bad" : "")} title={"Partner carrier repairs over the " + money(PARTNER_CAP) + " cap awaiting approval"}>
            <b>{counts.capFlag}</b><s>Over {money(PARTNER_CAP)}</s>
          </div>
          <div className={"stat" + (counts.overdue ? " bad" : counts.stale ? " warn" : "")}>
            <b>{counts.stale} / {counts.overdue}</b>
            <s>No touch 24h / 48h</s>
          </div>
        </div>
      </header>

      {hasDemo && (
        <div className="note">
          <span>Two example rows are on the board so you can see the layout. Clear them before you start tracking real units.</span>
          <button className="btn alt sm" style={{ marginLeft: "auto" }} onClick={clearDemo}>Clear examples</button>
        </div>
      )}

      <div className="bar">
        <div className="tabs">
          {["All", ...LOCATIONS].map((c) => (
            <button key={c} className="tab" aria-pressed={city === c} onClick={() => setCity(c)}>
              {c}
              <span className="n">{c === "All" ? counts.open : counts[c]}</span>
            </button>
          ))}
        </div>
        <div className="tabs">
          {["All", "Truck", "Trailer"].map((k) => (
            <button key={k} className="tab" aria-pressed={kind === k} onClick={() => setKind(k)}>{k}</button>
          ))}
        </div>
        <select className="sel" style={{ width: "auto" }} value={whose} onChange={(e) => setWhose(e.target.value)}>
          <option value="All">Anyone's</option>
          <option value="Mine">Mine{prefs.name ? " (" + prefs.name + ")" : ""}</option>
          <option value="Free">Unclaimed</option>
          {claimants.filter((n) => !prefs.name || n.toLowerCase() !== prefs.name.toLowerCase()).map((n) => (
            <option key={n} value={n}>{n}'s</option>
          ))}
        </select>
        <select className="sel" style={{ width: "auto" }} value={own} onChange={(e) => setOwn(e.target.value)}>
          <option value="All">Any ownership</option>
          <option value="GH">GH trailers</option>
          <option value="Leased">Leased trailers</option>
          <option value="Rented">Rented trailers</option>
          <option value="Partner">Partner Carrier</option>
        </select>
        <input className="inp search" placeholder="Search unit, shop, issue…" value={q} onChange={(e) => setQ(e.target.value)} />
      </div>

      <div className="wrap">
        {vendors.length === 0 && (
          <div className="empty">
            <strong>Add your shops first</strong>
            Every repair gets filed under a shop. Open <b>Shops</b> to add your vendors in San Antonio, Dallas, and Memphis.
            <div style={{ marginTop: 14 }}>
              <button className="btn" onClick={() => setModal("vendors")}>Add a shop</button>
            </div>
          </div>
        )}

        {freshList.length > 0 && (
          <section className="fresh-sec">
            <div className="fresh-hd">
              <h2>New — needs first review</h2>
              <span className="n">
                {freshList.length} not worked yet, by shop{city !== "All" ? " · " + city : ""}
              </span>
              <button className="btn alt sm" onClick={() => markAllSeen(freshList.map((r) => r.id))}>
                Mark all reviewed
              </button>
            </div>
            {byShop(freshList).map(({ vid, shop: v, rows }) => (
              <div className="shop" key={vid} style={{ margin: "0 0 -1px", border: 0, borderTop: "1px solid var(--rule)" }}>
                <div className="shop-hd">
                  <h3>{v.name}</h3>
                  <span className="ct">{rows.length}</span>
                  <span className="shop-sub">{v.city === OTR ? "OTR" : v.city}</span>
                  {v.phone && <span className="ph mono">{v.phone}</span>}
                  {v.address && (
                    <a className="addr mono" href={mapsUrl(v.address)} target="_blank" rel="noreferrer" title="Open in Google Maps">
                      📍 {v.address}
                    </a>
                  )}
                  <span className="spacer" />
                  <button className="btn alt sm" onClick={() => markAllSeen(rows.map((r) => r.id))}>
                    Reviewed
                  </button>
                </div>
                {rows.map((r) => (
                  <Row key={r.id} {...rowProps(r)} onSeen={() => markSeen(r.id)} />
                ))}
              </div>
            ))}
          </section>
        )}

        {shownCities.map((ct) => {
          const inCity = workedList.filter((r) => r.city === ct);
          const shopIds = [...new Set(inCity.map((r) => r.vendorId))];
          const tr = inCity.filter((r) => r.unitType === "Truck").length;
          const isOtr = ct === OTR;
          return (
            <section className={"city" + (isOtr ? " otr" : "")} key={ct}>
              <div className="city-hd">
                <h2>{isOtr ? "OTR — Road calls" : ct}</h2>
                <span className="sub-lab">{LOC_SUB[ct]}</span>
                <span className="mono" style={{ fontSize: 12, color: "var(--muted)" }}>{inCity.length} down</span>
                <span className="mix">{tr} truck · {inCity.length - tr} trailer</span>
              </div>

              {inCity.length === 0 ? (
                <div className="empty">
                  <strong>{isOtr ? "No units down on the road" : "Nothing down in " + ct}</strong>
                  {isOtr
                    ? "Log a road call here when a unit breaks down away from a terminal."
                    : "Add a unit when it goes into a shop here."}
                  {freshList.some((f) => f.city === ct) ? " New arrivals are up top until they're worked." : ""}
                </div>
              ) : (
                byShop(inCity).map(({ vid, shop: v, rows }) => {
                  const isShut = !!shut[vid];
                  return (
                    <div className={"shop" + (isShut ? " shut" : "")} key={vid}>
                      <div className="shop-hd">
                        <button
                          className="caret"
                          aria-label={isShut ? "Expand " + v.name : "Collapse " + v.name}
                          onClick={() => setShut({ ...shut, [vid]: !isShut })}
                        >
                          {isShut ? "\u25B6" : "\u25BC"}
                        </button>
                        <h3>{v.name}</h3>
                        <span className="ct">{rows.length}</span>
                        {v.phone && <span className="ph mono">{v.phone}</span>}
                        {v.address && (
                          <a className="addr mono" href={mapsUrl(v.address)} target="_blank" rel="noreferrer" title="Open in Google Maps">
                            📍 {v.address}
                          </a>
                        )}
                        <span className="spacer" />
                        <TimerButton
                          label={"Remind on all " + rows.length}
                          compact
                          canPark={false}
                          onSet={(sp) => setShopTimer(vid, sp)}
                        />
                        {rows.some((r) => !claimedBy(r)) && (
                          <button
                            className="btn alt sm"
                            style={{ marginLeft: 6 }}
                            title="Claim every unclaimed unit at this shop"
                            onClick={() => (prefs.name ? claimShop(vid, prefs.name) : setModal("me"))}
                          >
                            Claim shop
                          </button>
                        )}
                      </div>
                      {!isShut && rows.map((r) => <Row key={r.id} {...rowProps(r)} />)}
                    </div>
                  );
                                })
              )}
            </section>
          );
        })}
        {parkedList.length > 0 && (
          <section className="parked">
            <div className="parked-hd">
              <h2>Parked — waiting on a date</h2>
              <span className="n">{parkedList.length} unit{parkedList.length === 1 ? "" : "s"} · still down, off the active board</span>
              <button className="btn alt sm tog" onClick={() => setShowParked(!showParked)}>
                {showParked ? "Hide" : "Show"}
              </button>
            </div>
            {showParked && (
              <div className="parked-list">
                {parkedList.map((r) => (
                  <Row
                    key={r.id}
                    {...rowProps(r)}
                    showWhere={vendorOf(r.vendorId).name}
                    onUnpark={() => unpark(r.id)}
                  />
                ))}
              </div>
            )}
          </section>
        )}
      </div>

      {dueList.length > 0 && (
        <div className="tray" role="alert">
          <div className="tray-hd">
            <h5>Follow up now</h5>
            <span className="n">{dueList.length} waiting{ringing.length ? " · alarm active" : " · silenced"}</span>
            <span className="tiny" style={{ marginLeft: 8 }}>
              {prefs.name
                ? "Your units and anything unclaimed. Alarms only sound while this board is open."
                : "Set your name to see only your own alarms. Alarms only sound while this board is open."}
            </span>
            <div style={{ marginLeft: "auto", display: "flex", gap: 6 }}>
              {ringing.length > 0 && (
                <button className="bell" onClick={() => silenceAll(ringing)}>Silence all</button>
              )}
              <button
                className={"bell" + (prefs.sound ? "" : " off")}
                onClick={() => { armAudio(); savePrefs({ sound: !prefs.sound }); }}
              >
                {prefs.sound ? "Sound on" : "Sound off"}
              </button>
            </div>
          </div>
          {dueList.map((r) => {
            const v = vendorOf(r.vendorId);
            return (
              <div className="tray-row" key={r.id}>
                <span className="u">{r.unitNumber}</span>
                <ClaimChip r={r} me={prefs.name} readOnly />
                {tracksOwnership(r) && (
                  <span className={"own " + (onPartner(r) ? "partner" : OWN_CLASS[ownOf(r)])}>
                    {onPartner(r) ? "PARTNER" : OWN_LABEL[ownOf(r)]}
                  </span>
                )}
                <span className="s">
                  {v.name} · {r.city === OTR ? r.location || "OTR" : r.city} · {statusOf(r.statusId).label}
                </span>
                {v.phone && <span className="s mono">{v.phone}</span>}
                <span className="ov">{countdown(r.dueAt)}</span>
                <span className="ta">
                  <button className="btn alt sm" title="Off your screen only" onClick={() => mySnooze(r.id, 15, r.dueAt)}>Snooze 15</button>
                  <button className="btn alt sm" title="Off your screen only" onClick={() => mySnooze(r.id, 30, r.dueAt)}>Snooze 30</button>
                  {!ackedByMe(r) && (
                    <button className="bell" title="Stops your alarm only" onClick={() => mySilence(r.id, r.dueAt)}>Silence</button>
                  )}
                  <button
                    className="btn sm"
                    style={{ background: "#fff", color: "var(--ink)", borderColor: "#fff" }}
                    onClick={() => { setOpen(r.id); logFollowUp(r.id, "", 0); }}
                  >
                    Logged it
                  </button>
                </span>
              </div>
            );
          })}
        </div>
      )}

      {modal === "add" && (
        <AddRepair
          vendors={vendors}
          statuses={statuses}
          defaultMinutes={prefs.defaultMinutes}
          existingUnits={new Set(repairs.map(unitKey).filter(Boolean))}
          onAddVendor={(v) => commit((p) => ({ ...p, vendors: [...p.vendors, v] }))}
          onSave={(r) => { addRepair(r); setModal(null); }}
          onClose={() => setModal(null)}
        />
      )}
      {modal === "me" && (
        <WhoAmI
          name={prefs.name}
          team={claimants}
          repairs={repairs}
          onSave={(n) => { savePrefs({ name: n }); addTeamMember(n); setModal(null); }}
          onAdd={addTeamMember}
          onRemove={removeTeamMember}
          onClose={() => setModal(null)}
        />
      )}

      {modal === "vendors" && (
        <Vendors
          vendors={vendors}
          repairs={repairs}
          onAdd={(v) => commit((p) => ({ ...p, vendors: [...p.vendors, v] }))}
          onRemove={(id) => commit((p) => ({ ...p, vendors: p.vendors.filter((v) => v.id !== id) }))}
          onRename={(id, patch) =>
            commit((p) => {
              const before = p.vendors.find((v) => v.id === id);
              const moved = patch.city && before && patch.city !== before.city;
              return {
                ...p,
                vendors: p.vendors.map((v) => (v.id === id ? { ...v, ...patch } : v)),
                /* a shop's units follow it, otherwise they'd be filed under the wrong city */
                repairs: moved
                  ? p.repairs.map((r) => (r.vendorId === id ? { ...r, city: patch.city } : r))
                  : p.repairs,
                archive: moved
                  ? p.archive.map((r) => (r.vendorId === id ? { ...r, city: patch.city } : r))
                  : p.archive,
              };
            })
          }
          onClose={() => setModal(null)}
        />
      )}
      {modal === "statuses" && (
        <Statuses
          statuses={statuses}
          repairs={repairs}
          onAdd={(s) => commit((p) => ({ ...p, statuses: [...p.statuses, s] }))}
          onRemove={(id) => commit((p) => ({ ...p, statuses: p.statuses.filter((s) => s.id !== id) }))}
          onClose={() => setModal(null)}
        />
      )}
      {modal === "csv" && (
        <ExportCsv repairs={repairs} archive={archive} vendorOf={vendorOf} statusOf={statusOf} onClose={() => setModal(null)} />
      )}
    </div>
  );
}

function ClaimChip({ r, me, team = [], onClaim, onRelease, onNeedName, onAddName, readOnly }) {
  const [menu, setMenu] = useState(false);
  const [adding, setAdding] = useState("");
  const who = claimedBy(r);
  const mine = isMine(r, me);
  const box = useRef(null);

  useEffect(() => {
    if (!menu) return;
    const away = (e) => {
      if (box.current && !box.current.contains(e.target)) { setMenu(false); setAdding(""); }
    };
    document.addEventListener("pointerdown", away);
    return () => document.removeEventListener("pointerdown", away);
  }, [menu]);

  if (readOnly) {
    if (!who) return <span className="claim free ro">Unclaimed</span>;
    return (
      <span className={"claim ro " + (mine ? "mine" : "other")}>
        <span className="av">{initials(who)}</span>
        {mine ? "You" : who}
      </span>
    );
  }

  const others = team.filter((n) => n.toLowerCase() !== (who || "").toLowerCase());
  const addName = () => {
    const n = adding.trim();
    if (!n) return;
    onAddName ? onAddName(n) : onClaim(n);
    setAdding("");
    setMenu(false);
  };

  const assignMenu = (
    <span className="cmenu">
      {me && !mine && (
        <button onClick={() => { onClaim(me); setMenu(false); }}>
          {who ? "Take over — " + me : "Claim for me — " + me}
        </button>
      )}
      {!me && (
        <button onClick={() => { onNeedName(); setMenu(false); }}>Set your name first</button>
      )}
      {others.length > 0 && <span className="cmenu-lab">Assign to</span>}
      {others.map((n) => (
        <button key={n} onClick={() => { onClaim(n); setMenu(false); }}>
          <span className="av sm">{initials(n)}</span> {n}
        </button>
      ))}
      <span className="cmenu-lab">Someone else</span>
      <span className="cmenu-row">
        <input
          value={adding}
          placeholder="Name"
          onChange={(e) => setAdding(e.target.value)}
          onKeyDown={(e) => e.key === "Enter" && addName()}
        />
        <button onClick={addName} disabled={!adding.trim()}>Assign</button>
      </span>
      {who && (
        <button className="rel" onClick={() => { onRelease(); setMenu(false); }}>
          {mine ? "Release it" : "Unclaim for " + who}
        </button>
      )}
    </span>
  );

  /* unclaimed: one click takes it for yourself, the caret assigns it to someone else */
  if (!who) {
    return (
      <span className="claim-group" ref={box}>
        <button
          className="claim free"
          title={me ? "Claim it for " + me : "Set your name, then claim"}
          onClick={() => (me ? onClaim(me) : onNeedName())}
        >
          + Claim
        </button>
        <button className="claim-more" title="Assign to someone else" onClick={() => setMenu(!menu)}>▾</button>
        {menu && assignMenu}
      </span>
    );
  }

  return (
    <span className={"claim " + (mine ? "mine" : "other")} ref={box}>
      <span className="av">{initials(who)}</span>
      <button
        onClick={() => setMenu(!menu)}
        title={who + " claimed this" + (r.claimedAt ? " " + stamp(r.claimedAt) : "") + " — click to reassign"}
        style={{ all: "unset", cursor: "pointer" }}
      >
        {mine ? "You" : who} <span style={{ opacity: 0.6, fontSize: 9 }}>▾</span>
      </button>
      {menu && assignMenu}
    </span>
  );
}

function TimerButton({ label, state = "none", onSet, compact, canPark = true, restartMinutes }) {
  const [open, setOpen] = useState(false);
  const [mins, setMins] = useState("");
  const [at, setAt] = useState("");
  const [park, setPark] = useState(true);
  const box = useRef(null);

  useEffect(() => {
    if (!open) return;
    const away = (e) => {
      if (box.current && !box.current.contains(e.target)) setOpen(false);
    };
    document.addEventListener("pointerdown", away);
    return () => document.removeEventListener("pointerdown", away);
  }, [open]);

  const done = () => {
    setOpen(false);
    setMins("");
    setAt("");
  };
  const pickMinutes = (m) => {
    armAudio();
    onSet(m ? { minutes: m } : { clear: true });
    done();
  };
  const pickDate = () => {
    if (!at) return;
    const iso = new Date(at).toISOString();
    armAudio();
    onSet({ at: iso, park: canPark && park });
    done();
  };
  const tomorrow8 = () => {
    const d = new Date();
    d.setDate(d.getDate() + 1);
    d.setHours(8, 0, 0, 0);
    setAt(toLocalInput(d.toISOString()));
  };

  return (
    <span className={"tmr " + state} ref={box} style={compact ? { marginLeft: 10, fontSize: 11 } : null}>
      <button
        onClick={() => setOpen(!open)}
        style={{ all: "unset", cursor: "pointer", display: "inline-flex", alignItems: "center", gap: 5 }}
      >
        <span className="clock" aria-hidden="true">{state === "ring" ? "⏰" : state === "parked" ? "📅" : "⏱"}</span>
        {label}
      </button>
      {open && (
        <span className="pmenu">
          {restartMinutes > 0 && (
            <>
              <span className="pmenu-lab">Restart</span>
              <button className="full go" onClick={() => pickMinutes(restartMinutes)}>
                ↻ Start over — {minLabel(restartMinutes)}
              </button>
            </>
          )}
          <span className="pmenu-lab">Later today</span>
          {PRESETS.map((p) => (
            <button key={p.m} onClick={() => pickMinutes(p.m)}>{p.label}</button>
          ))}
          <span className="pmenu-row">
            <input
              type="number"
              min="1"
              placeholder="min"
              value={mins}
              onChange={(e) => setMins(e.target.value)}
              onKeyDown={(e) => {
                if (e.key === "Enter" && Number(mins) > 0) pickMinutes(Number(mins));
              }}
            />
            <button onClick={() => Number(mins) > 0 && pickMinutes(Number(mins))}>Set</button>
          </span>

          <span className="pmenu-lab">On a date</span>
          <span className="pmenu-row">
            <input
              className="dt"
              type="datetime-local"
              value={at}
              onChange={(e) => setAt(e.target.value)}
              onKeyDown={(e) => e.key === "Enter" && pickDate()}
            />
          </span>
          <span className="pmenu-row">
            <button onClick={tomorrow8}>Tomorrow 8 AM</button>
          </span>
          {canPark && (
            <label className="pmenu-row park">
              <input type="checkbox" checked={park} onChange={(e) => setPark(e.target.checked)} />
              <span>Park it — keep off the active board until then</span>
            </label>
          )}
          <span className="pmenu-row">
            <button className="full go" disabled={!at} onClick={pickDate}>
              {at ? "Set for " + fmtDue(new Date(at).toISOString()) : "Pick a date first"}
            </button>
          </span>

          {state !== "none" && (
            <button className="full clear" onClick={() => pickMinutes(0)}>Clear reminder</button>
          )}
        </span>
      )}
    </span>
  );
}

/* ---------------------------- attachments -------------------------- */
/* Invoices, photos, and videos live in Firebase Storage; the repair
   record only keeps the link, name, and who added it. */

const FILE_KINDS = [
  { k: "invoice", label: "Invoice", accept: ".pdf,.doc,.docx,.xls,.xlsx,image/*", max: 25 },
  { k: "receipt", label: "Receipt", accept: ".pdf,.doc,.docx,image/*", max: 25 },
  { k: "photo", label: "Photo", accept: "image/*", max: 25 },
  { k: "video", label: "Video", accept: "video/*", max: 200 },
];

/* What a closed-out repair needs on file before the paperwork is done.
   Media is either a photo or a video — one shot of the issue is enough. */
const hasKind = (r, ...kinds) => (r.files || []).some((f) => kinds.includes(f.kind));
const PAPERWORK = [
  { id: "invoice", label: "Invoice", has: (r) => hasKind(r, "invoice") },
  { id: "media", label: "Photo / video", has: (r) => hasKind(r, "photo", "video") },
  { id: "receipt", label: "Receipt", has: (r) => hasKind(r, "receipt") },
  { id: "approver", label: "Approved by", has: (r) => !!(r.approver && r.approver.trim()) },
];
const missingPaperwork = (r) => PAPERWORK.filter((p) => !p.has(r));
const paperworkComplete = (r) => missingPaperwork(r).length === 0;

function Attachments({ r, me, onPatch }) {
  const [busy, setBusy] = useState(null); // { name, pct, stage } while uploading
  const [err, setErr] = useState("");
  const [ask, setAsk] = useState(null); // confirming an invoice total
  const files = r.files || [];
  const invoices = files.filter((f) => f.kind === "invoice");
  const photos = files.filter((f) => f.kind === "photo");
  const videos = files.filter((f) => f.kind === "video");

  const pick = (kind, max) => (e) => {
    const list = [...e.target.files];
    e.target.value = "";
    if (!list.length) return;
    setErr("");
    (async () => {
      for (const f of list) {
        if (f.size > max * 1048576) {
          setErr(f.name + " is too big — " + kind + "s max out at " + max + " MB.");
          continue;
        }
        setBusy({ name: f.name, pct: 0 });
        try {
          const up = await window.uploadRepairFile(f, (pct) => setBusy({ name: f.name, pct }));
          const fid = uid("f");
          onPatch((cur) => ({
            files: [
              ...(cur.files || []),
              { id: fid, kind, name: up.name, size: up.size, mime: up.mime, url: up.url, path: up.path, at: nowISO(), by: me || "", amount: 0 },
            ],
          }));
          /* an invoice needs a total so the $150 partner rule can judge it.
             Try to read it off the file, then hand it over for confirming. */
          if (kind === "invoice") {
            const read = await window.readInvoiceTotal(f, (stage) => setBusy({ name: f.name, pct: 100, stage }));
            setAsk({ fileId: fid, name: up.name, value: read > 0 ? String(read.toFixed(2)) : "", guessed: read > 0 });
          }
        } catch (ex) {
          const code = ex && ex.code;
          setErr(
            f.name + ": " +
            (code === "storage/unauthorized" ? "blocked by Storage security rules"
              : code === "storage/unknown" ? "cloud file storage may not be enabled"
              : ex && ex.message ? ex.message : "upload failed")
          );
        }
      }
      setBusy(null);
    })();
  };

  const remove = (f) => {
    if (!window.confirm("Remove " + f.name + " from this repair?")) return;
    onPatch((cur) => ({ files: (cur.files || []).filter((x) => x.id !== f.id) }));
    window.deleteRepairFile(f.path);
  };

  const saveAmount = () => {
    const n = Number(String(ask.value).replace(/[^0-9.]/g, ""));
    const amount = isFinite(n) && n > 0 ? n : 0;
    onPatch((cur) => ({
      files: (cur.files || []).map((x) => (x.id === ask.fileId ? { ...x, amount } : x)),
      /* the biggest invoice on the repair is what the cap is judged against */
      ...(amount > 0 ? { partnerCost: Math.max(amount, Number(cur.partnerCost) || 0) } : {}),
    }));
    setAsk(null);
  };

  return (
    <div className="attach">
      <div className="attach-hd">
        <label className="lab" style={{ margin: 0 }}>Files — invoice, receipt, photos, videos</label>
        {FILE_KINDS.map((fk) => (
          <label key={fk.k} className="btn alt sm attach-add">
            + {fk.label}
            <input type="file" accept={fk.accept} multiple style={{ display: "none" }} onChange={pick(fk.k, fk.max)} />
          </label>
        ))}
      </div>
      {busy && (
        <div className="meta">
          {busy.stage ? busy.stage + " (" + busy.name + ")" : "Uploading " + busy.name + "… " + busy.pct + "%"}
        </div>
      )}
      {err && <div className="err">{err}</div>}
      {ask && (
        <div className="ask-amt">
          <span className="meta">
            {ask.guessed ? (
              <>Read <b>{money(Number(ask.value))}</b> off {ask.name} — correct it if that's wrong.</>
            ) : (
              <>Couldn't read a total off {ask.name}. Enter the invoice amount:</>
            )}
          </span>
          <span className="ask-row">
            <input
              className="inp mono"
              type="number"
              min="0"
              step="0.01"
              autoFocus
              value={ask.value}
              placeholder="0.00"
              onChange={(e) => setAsk({ ...ask, value: e.target.value })}
              onKeyDown={(e) => e.key === "Enter" && saveAmount()}
            />
            <button className="btn sm" onClick={saveAmount}>Save total</button>
            <button className="btn alt sm" onClick={() => setAsk(null)}>Skip</button>
          </span>
        </div>
      )}
      {invoices.length > 0 && (
        <div className="attach-docs">
          {invoices.map((f) => (
            <span className="doc" key={f.id}>
              📄 <a href={f.url} target="_blank" rel="noreferrer">{f.name}</a>
              {f.amount > 0 && (
                <b className={f.amount > PARTNER_CAP && onPartner(r) ? "over" : ""}>{money(f.amount)}</b>
              )}
              <span className="meta">{fmtSize(f.size)}{f.by ? " · " + f.by : ""}</span>
              <button className="fx" title="Remove" onClick={() => remove(f)}>×</button>
            </span>
          ))}
        </div>
      )}
      {(photos.length > 0 || videos.length > 0) && (
        <div className="attach-media">
          {photos.map((f) => (
            <span className="thumb" key={f.id} title={f.name}>
              <a href={f.url} target="_blank" rel="noreferrer">
                <img src={f.url} alt={f.name} loading="lazy" />
              </a>
              <button className="fx" title="Remove" onClick={() => remove(f)}>×</button>
            </span>
          ))}
          {videos.map((f) => (
            <span className="thumb vid" key={f.id} title={f.name}>
              <video src={f.url} controls preload="metadata" />
              <button className="fx" title="Remove" onClick={() => remove(f)}>×</button>
            </span>
          ))}
        </div>
      )}
      {files.length === 0 && !busy && <div className="meta">Nothing attached yet.</div>}
    </div>
  );
}
