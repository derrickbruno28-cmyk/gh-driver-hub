                }}
              >
                <option value="Truck">Truck</option>
                <option value="Trailer">Trailer</option>
              </select>
            </div>
            <div>
              <label className="lab">Status</label>
              <select className="sel" value={r.statusId} onChange={(e) => onPatch({ statusId: e.target.value })}>
                {statuses.map((s) => <option key={s.id} value={s.id}>{s.label}</option>)}
              </select>
            </div>
            <div>
              <label className="lab">Shop</label>
              <select
                className="sel"
                value={r.vendorId || ""}
                onChange={(e) => {
                  const v = vendors.find((x) => x.id === e.target.value);
                  onPatch({ vendorId: e.target.value, city: v ? v.city : r.city });
                }}
              >
                <option value="">— Pending / not decided yet —</option>
                {vendors.map((v) => <option key={v.id} value={v.id}>{v.name} — {v.city}</option>)}
              </select>
            </div>
            {r.city === OTR && (
              <div>
                <label className="lab">Breakdown location</label>
                <input
                  className="inp"
                  value={r.location || ""}
                  placeholder="Ozona, TX — I-10 WB, MM 365"
                  onChange={(e) => onPatch({ location: e.target.value })}
                />
              </div>
            )}
            {tracksOwnership(r) && (
              <div>
                <label className="lab">Trailer ownership</label>
                <select
                  className="sel"
                  value={ownOf(r)}
                  onChange={(e) => {
                    const o = e.target.value;
                    /* the standalone partner flag is legacy — picking any
                       ownership here is now the single source of truth */
                    onPatch(
                      o === "Partner"
                        ? { ownership: o, partner: false, lessor: "" }
                        : { ownership: o, partner: false, partnerCarrier: "" }
                    );
                  }}
                >
                  {OWNERSHIP.map((o) => <option key={o} value={o}>{OWN_OPTION[o]}</option>)}
                </select>
              </div>
            )}
            {tracksOwnership(r) && onHire(r) && (
              <div>
                <label className="lab">{ownOf(r) === "Rented" ? "Rental company" : "Lessor"}</label>
                <input
                  className="inp"
                  value={r.lessor || ""}
                  placeholder="XTRA Lease"
                  onChange={(e) => onPatch({ lessor: e.target.value })}
                />
              </div>
            )}
            {tracksOwnership(r) && onPartner(r) && (
              <div>
                <label className="lab">Partner carrier name</label>
                <input
                  className="inp"
                  value={r.partnerCarrier || ""}
                  placeholder="Rodriguez Freight"
                  onChange={(e) => onPatch({ partnerCarrier: e.target.value })}
                />
              </div>
            )}
            {tracksOwnership(r) && onPartner(r) && (
              <div>
                <label className="lab">Invoice total (once known)</label>
                <input
                  className="inp mono"
                  type="number"
                  min="0"
                  step="0.01"
                  value={r.partnerCost == null || r.partnerCost === "" ? "" : r.partnerCost}
                  placeholder="0.00"
                  onChange={(e) => onPatch({ partnerCost: e.target.value === "" ? "" : Number(e.target.value) })}
                />
              </div>
            )}
            <div>
              <label className="lab">Date reported</label>
              <input
                className="inp"
                type="date"
                value={toLocalInput(r.reportedAt).slice(0, 10)}
                onChange={(e) => e.target.value && onPatch({ reportedAt: new Date(e.target.value + "T12:00:00").toISOString() })}
              />
            </div>
            <div>
              <label className="lab">Requested by</label>
              <input
                className="inp"
                value={r.requestedBy || ""}
                placeholder="Who asked for this repair"
                onChange={(e) => onPatch({ requestedBy: e.target.value })}
              />
            </div>
            <div>
              <label className="lab">Driver who reported (name / phone)</label>
              <input
                className="inp"
                value={r.driver || ""}
                placeholder="D. Sanchez — (210) 555-0000"
                onChange={(e) => onPatch({ driver: e.target.value })}
              />
            </div>
            <div>
              <label className="lab">Condition</label>
              <label className="meta" style={{ display: "flex", gap: 6, alignItems: "center", marginTop: 6 }}>
                <input
                  type="checkbox"
                  checked={r.safeToDrive !== false}
                  onChange={(e) => onPatch({ safeToDrive: e.target.checked })}
                />
                <span>Unit is safe to drive</span>
              </label>
              <label className="meta" style={{ display: "flex", gap: 6, alignItems: "center", marginTop: 6 }}>
                <input
                  type="checkbox"
                  checked={!!r.loadedTrailer}
                  onChange={(e) => onPatch({ loadedTrailer: e.target.checked })}
                />
                <span>Hooked to loaded trailer</span>
              </label>
            </div>
            {r.loadedTrailer && (
              <div>
                <label className="lab">Delivery date / time</label>
                <input
                  className="inp"
                  type="datetime-local"
                  value={r.deliveryAt ? toLocalInput(r.deliveryAt) : ""}
                  onChange={(e) => onPatch({ deliveryAt: e.target.value ? new Date(e.target.value).toISOString() : "" })}
                />
              </div>
            )}
            <div>
              <label className="lab">Issue</label>
              <input className="inp" value={r.issue} onChange={(e) => onPatch({ issue: e.target.value })} />
            </div>
            <div>
              <label className="lab">POC — point of contact</label>
              <input
                className="inp"
                value={r.poc || ""}
                placeholder="Mike, service writer — (210) 555-0000"
                onChange={(e) => onPatch({ poc: e.target.value })}
              />
            </div>
            <div>
              <label className="lab">Priority</label>
              <select className="sel" value={prioOf(r)} onChange={(e) => onPatch({ priority: Number(e.target.value) })}>
                {PRIORITIES.map((p) => <option key={p.p} value={p.p}>{p.p} — {p.label}</option>)}
              </select>
            </div>
            <div>
              <label className="lab">Approved by</label>
              <input
                className="inp"
                value={r.approver || ""}
                placeholder="Who signed off on this repair"
                onChange={(e) => onPatch({ approver: e.target.value })}
              />
            </div>
          </div>

          {onPartner(r) && (
            <div
              className={
                "cap " +
                (partnerFlagged(r) ? "is-flagged" : partnerCleared(r) ? "is-cleared" : r.partnerCapOk ? "is-ok" : "is-unset")
              }
            >
              <div className="cap-hd">
                <h6>Partner carrier — {money(PARTNER_CAP)} rule</h6>
                <span className="cap-state">
                  {partnerFlagged(r)
                    ? "⚠ Over " + money(PARTNER_CAP) + " — needs approval"
                    : partnerCleared(r)
                    ? "✓ Overage approved by " + r.partnerApprovedBy
                    : r.partnerCapOk
                    ? "✓ Within the cap"
                    : "Not confirmed yet"}
                </span>
              </div>
              <label className="meta cap-check">
                <input
                  type="checkbox"
                  checked={r.partnerCapOk === true}
                  onChange={(e) => onPatch({ partnerCapOk: e.target.checked })}
                />
                <span>
                  This repair is <b>{money(PARTNER_CAP)} or less</b> — pre-approved under the partner carrier agreement.
                </span>
              </label>
              {invoiceTotal(r) > 0 && (
                <div className="meta" style={{ marginTop: 7 }}>
                  Invoice logged at <b className={invoiceTotal(r) > PARTNER_CAP ? "over" : ""}>{money(invoiceTotal(r))}</b>
                  {invoiceTotal(r) > PARTNER_CAP
                    ? " — " + money(invoiceTotal(r) - PARTNER_CAP) + " over the cap."
                    : " — within the cap."}
                </div>
              )}
              {partnerFlagged(r) && (
                <div className="cap-act">
                  <span className="meta">
                    Hold the repair until someone signs off on the extra spend.
                  </span>
                  <button
                    className="btn sm"
                    onClick={() =>
                      me
                        ? onPatch({ partnerApprovedBy: me, partnerApprovedAt: nowISO() })
                        : onNeedName()
                    }
                  >
                    Approve the overage
                  </button>
                </div>
              )}
              {partnerCleared(r) && (
                <div className="cap-act">
                  <span className="meta">
                    Approved by <b>{r.partnerApprovedBy}</b>
                    {r.partnerApprovedAt ? " · " + stamp(r.partnerApprovedAt) : ""}
                  </span>
                  <button
                    className="btn alt sm"
                    onClick={() => onPatch({ partnerApprovedBy: "", partnerApprovedAt: "" })}
                  >
                    Undo approval
                  </button>
                </div>
              )}
            </div>
          )}

          <Attachments r={r} me={me} onPatch={onPatch} />

          <div className="meta autosave">
            ✓ The fields above save on their own as you change them — no save button needed. The note box below is
            separate: it adds a new dated entry to the history.
          </div>

          <div style={{ marginTop: 12 }}>
            <label className="lab">Add a follow-up note</label>
            <textarea
              className="ta"
              ref={noteRef}
              value={note}
              placeholder="Who you spoke with, what they promised, ETA…"
              onChange={(e) => setNote(e.target.value)}
            />
            <div className="foot">
              {!closing ? (
                <>
                  <button className="btn danger sm" onClick={() => setClosing(true)}>Mark repaired</button>
                  {onRemove && (
                    <button
                      className="btn danger sm"
                      title="Delete this entry entirely — for duplicates and mis-entries"
                      onClick={() =>
                        window.confirm(
                          "Remove " + r.unitNumber + " from the board?\n\nThis deletes the entry and any files attached to it. " +
                          "It does NOT go into Repaired — use \"Mark repaired\" for units that were actually fixed."
                        ) && onRemove()
                      }
                    >
                      Remove from board
                    </button>
                  )}
                  <span className="meta" style={{ display: "flex", alignItems: "center", gap: 6 }}>
                    then remind me in
                    <select className="sel" style={{ width: "auto", padding: "5px 8px" }} value={nextMin} onChange={(e) => setNextMin(e.target.value)}>
                      <option value="0">no reminder</option>
                      {PRESETS.map((p) => <option key={p.m} value={p.m}>{p.label}</option>)}
                    </select>
                  </span>
                  <button
                    className="btn sm"
                    disabled={!note.trim()}
                    title={note.trim() ? "Add this note to the history" : "Type a note above first"}
                    onClick={() => { onFollowUp(note.trim(), Number(nextMin) || 0); setNote(""); }}
                  >
                    Add note
                  </button>
                  <button className="btn alt sm" onClick={onToggle}>Done</button>
                </>
              ) : (
                <>
                  <span className="meta" style={{ marginRight: "auto" }}>
                    Moves {r.unitNumber} off the board into Repaired.
                  </span>
                  <button className="btn alt sm" onClick={() => setClosing(false)}>Keep tracking</button>
                  <button className="btn sm" onClick={() => onClose(note.trim())}>Confirm repaired</button>
                </>
              )}
            </div>
          </div>

          {r.followUps && r.followUps.length > 0 && (
            <ul className="hist">
              {[...r.followUps].reverse().map((f, i) => {
                const idx = r.followUps.length - 1 - i; // index in the real, unreversed list
                return (
                  <li key={idx}>
                    <time className="mono">
                      {stamp(f.at)}
                      {f.editedAt ? " · edited" : ""}
                    </time>
                    {editIdx === idx ? (
                      <span className="hist-edit">
                        <textarea
                          className="ta"
                          value={editTxt}
                          autoFocus
                          onChange={(e) => setEditTxt(e.target.value)}
                        />
                        <span className="hist-acts">
                          <button className="btn alt sm" onClick={() => setEditIdx(null)}>Cancel</button>
                          <button
                            className="btn sm"
                            disabled={!editTxt.trim()}
                            onClick={() => { onEditFollowUp(idx, editTxt.trim()); setEditIdx(null); }}
                          >
                            Save note
                          </button>
                        </span>
                      </span>
                    ) : (
                      <>
                        {f.note}
                        <span className="hist-acts">
                          <button
                            className="hlink"
                            title="Edit this note"
                            onClick={() => { setEditIdx(idx); setEditTxt(f.note); }}
                          >
                            Edit
                          </button>
                          <button
                            className="hlink danger"
                            title="Delete this note"
                            onClick={() => window.confirm("Delete this follow-up note?") && onDeleteFollowUp(idx)}
                          >
                            Delete
                          </button>
                        </span>
                      </>
                    )}
                  </li>
                );
              })}
            </ul>
          )}
        </div>
      )}
    </div>
  );
}

/* ------------------------------ sheets ---------------------------- */

function Sheet({ title, children, onClose, wide }) {
  return (
    <div className="scrim" onClick={onClose}>
      <div className="sheet" style={wide ? { maxWidth: 760 } : null} onClick={(e) => e.stopPropagation()}>
        <div className="sheet-hd">
          <h4>{title}</h4>
          <button className="x" onClick={onClose} aria-label="Close">×</button>
        </div>
        <div className="sheet-bd">{children}</div>
      </div>
    </div>
  );
}

function AddRepair({ vendors, statuses, defaultMinutes, existingUnits, onAddVendor, onSave, onClose }) {
  const [city, setCity] = useState(LOCATIONS[0]);
  const [vendorId, setVendorId] = useState("");
  const [unitType, setType] = useState("Truck");
  const [unitNumber, setUnit] = useState("");
  const [ownership, setOwnership] = useState("GH");
  const [lessor, setLessor] = useState("");
  const [partnerCarrier, setPartnerCarrier] = useState("");
  const [issue, setIssue] = useState("");
  const [priority, setPriority] = useState(3);
  const [requestedBy, setRequestedBy] = useState("");
  const [driver, setDriver] = useState("");
  const [safeToDrive, setSafeToDrive] = useState(true);
  const [loadedTrailer, setLoadedTrailer] = useState(false);
  const [deliveryAt, setDeliveryAt] = useState("");
  const [statusId, setStatus] = useState(statuses[0] ? statuses[0].id : "");
  const [when, setWhen] = useState(toLocalInput(nowISO()).slice(0, 10));
  const [remind, setRemind] = useState(String(defaultMinutes || 30));
  const [remindAt, setRemindAt] = useState("");
  const [parkIt, setParkIt] = useState(true);
  const [location, setLocation] = useState("");
  const [newShop, setNewShop] = useState("");
  const [newShopAddr, setNewShopAddr] = useState("");
  const [poc, setPoc] = useState("");
  const [err, setErr] = useState("");

  const isOtr = city === OTR;
  const cityShops = vendors.filter((v) => v.city === city);
  useEffect(() => {
    setVendorId(cityShops.length ? cityShops[0].id : "");
  }, [city, vendors.length]);

  const addShop = () => {
    const name = newShop.trim();
    if (!name) return;
    const v = { id: uid("v"), name, city, phone: "", address: newShopAddr.trim() };
    onAddVendor(v);
    setVendorId(v.id);
    setNewShop("");
    setNewShopAddr("");
  };

  const save = () => {
    if (!unitNumber.trim()) return setErr("Enter the unit number.");
    if (isOtr && !location.trim()) return setErr("Enter where the unit is — town and state, or highway and mile marker.");
    if (!issue.trim()) return setErr("Add a short description of the issue.");
    if (remind === "date" && !remindAt) return setErr("Pick the date you expect an update.");
    const onDate = remind === "date";
    onSave({
      id: uid("r"),
      city,
      location: isOtr ? location.trim() : "",
      vendorId,
      unitType,
      unitNumber: unitNumber.trim().toUpperCase(),
      ownership: unitType === "Trailer" ? ownership : "GH",
      lessor: unitType === "Trailer" && (ownership === "Leased" || ownership === "Rented") ? lessor.trim() : "",
      partnerCarrier: unitType === "Trailer" && ownership === "Partner" ? partnerCarrier.trim() : "",
      issue: issue.trim(),
      poc: poc.trim(),
      priority,
      requestedBy: requestedBy.trim(),
      driver: driver.trim(),
      safeToDrive,
      loadedTrailer,
      deliveryAt: loadedTrailer && deliveryAt ? new Date(deliveryAt).toISOString() : "",
      statusId,
      reportedAt: when ? new Date(when + "T12:00:00").toISOString() : nowISO(),
      dueAt: onDate ? new Date(remindAt).toISOString() : Number(remind) > 0 ? inMinutes(Number(remind)) : null,
      parked: onDate ? parkIt : false,
      dueAck: false,
      followUps: [],
    });
  };

  return (
    <Sheet title="Report a unit down" onClose={onClose}>
      <div className="field">
        <label className="lab">Unit type</label>
        <div className="seg-ctl">
          {["Truck", "Trailer"].map((k) => (
            <button
              key={k}
              aria-pressed={unitType === k}
              onClick={() => {
                setType(k);
                if (k === "Truck") { setOwnership("GH"); setLessor(""); }
              }}
            >
              {k}
            </button>
          ))}
        </div>
      </div>
      {unitType === "Trailer" && (
        <div className="field">
          <label className="lab">Trailer ownership</label>
          <div className="seg-ctl">
            {OWNERSHIP.map((o) => (
              <button key={o} aria-pressed={ownership === o} onClick={() => setOwnership(o)}>
                {OWN_OPTION[o]}
              </button>
            ))}
          </div>
        </div>
      )}
      {unitType === "Trailer" && (ownership === "Leased" || ownership === "Rented") && (
        <div className="field">
          <label className="lab">{ownership === "Rented" ? "Rental company" : "Lessor"}</label>
          <input className="inp" value={lessor} placeholder="XTRA Lease" onChange={(e) => setLessor(e.target.value)} />
        </div>
      )}
      {unitType === "Trailer" && ownership === "Partner" && (
        <div className="field">
          <label className="lab">Partner carrier name</label>
          <input
            className="inp"
            value={partnerCarrier}
            placeholder="Rodriguez Freight"
            onChange={(e) => setPartnerCarrier(e.target.value)}
          />
        </div>
      )}
      <div className="grid2">
        <div className="field">
          <label className="lab">Unit number</label>
          <input
            className="inp mono"
            value={unitNumber}
            placeholder="T-4417"
            onChange={(e) => {
              const v = e.target.value;
              setUnit(v);
              /* 400-, 700-, and 900-series units are trucks */
              if (/^[479]\d\d$/.test(v.trim())) {
                setType("Truck");
                setOwnership("GH");
                setLessor("");
              }
            }}
          />
          {existingUnits && existingUnits.has(unitNumber.trim().toUpperCase()) && (
            <div className="err" style={{ marginTop: 6 }}>
              ⚠ {unitNumber.trim().toUpperCase()} is already on the board — adding it again will flag both as duplicates.
            </div>
          )}
        </div>
        <div className="field">
          <label className="lab">Where it's assigned</label>
          <select className="sel" value={city} onChange={(e) => setCity(e.target.value)}>
            {CITIES.map((c) => <option key={c} value={c}>{c}</option>)}
            <option value={OTR}>OTR — broke down on the road</option>
          </select>
        </div>
      </div>
      {isOtr && (
        <div className="field">
          <label className="lab">Breakdown location</label>
          <input
            className="inp"
            value={location}
            placeholder="Ozona, TX — I-10 WB, MM 365"
            onChange={(e) => setLocation(e.target.value)}
          />
        </div>
      )}
      <div className="field">
        <label className="lab">{isOtr ? "Road service or shop" : "Shop"}</label>
        <select className="sel" value={vendorId} onChange={(e) => setVendorId(e.target.value)}>
          <option value="">— Pending / not decided yet —</option>
          {cityShops.map((v) => <option key={v.id} value={v.id}>{v.name}</option>)}
        </select>
        {!vendorId && (
          <div className="meta" style={{ marginTop: 6 }}>
            No shop picked — it goes on the board under "Pending shop" and you can assign one later from Edit.
          </div>
        )}
        <div style={{ display: "flex", gap: 8, marginTop: 8 }}>
          <input
            className="inp"
            placeholder={isOtr ? "New road service vendor" : "New shop in " + city}
            value={newShop}
            onChange={(e) => setNewShop(e.target.value)}
          />
          <button className="btn alt" onClick={addShop} disabled={!newShop.trim()}>Add</button>
        </div>
        {newShop.trim() && (
          <input
            className="inp"
            style={{ marginTop: 8 }}
            placeholder="Street address (optional) — 4815 Interstate 10 E, San Antonio, TX"
            value={newShopAddr}
            onChange={(e) => setNewShopAddr(e.target.value)}
          />
        )}
      </div>
      <div className="field">
        <label className="lab">Issue</label>
        <textarea className="ta" value={issue} placeholder="What's wrong, and is it out of service?" onChange={(e) => setIssue(e.target.value)} />
      </div>
      <div className="grid2">
        <div className="field">
          <label className="lab">Requested by</label>
          <input className="inp" value={requestedBy} placeholder="Who asked for this repair" onChange={(e) => setRequestedBy(e.target.value)} />
        </div>
        <div className="field">
          <label className="lab">Driver who reported (name / phone)</label>
          <input className="inp" value={driver} placeholder="D. Sanchez — (210) 555-0000" onChange={(e) => setDriver(e.target.value)} />
        </div>
      </div>
      <div className="field">
        <label className="meta" style={{ display: "flex", gap: 6, alignItems: "center" }}>
          <input type="checkbox" checked={safeToDrive} onChange={(e) => setSafeToDrive(e.target.checked)} />
          <span>Unit is safe to drive</span>
        </label>
        <label className="meta" style={{ display: "flex", gap: 6, alignItems: "center", marginTop: 7 }}>
          <input type="checkbox" checked={loadedTrailer} onChange={(e) => setLoadedTrailer(e.target.checked)} />
          <span>Unit is hooked to a loaded trailer</span>
        </label>
        {loadedTrailer && (
          <div style={{ marginTop: 8 }}>
            <label className="lab">Delivery date / time</label>
            <input className="inp" type="datetime-local" value={deliveryAt} onChange={(e) => setDeliveryAt(e.target.value)} />
          </div>
        )}
      </div>
      <div className="field">
        <label className="lab">Priority</label>
        <div className="seg-ctl">
          {PRIORITIES.map((p) => (
            <button key={p.p} aria-pressed={priority === p.p} onClick={() => setPriority(p.p)}>
              {p.p} — {p.label}
            </button>
          ))}
        </div>
      </div>
      <div className="field">
        <label className="lab">POC — point of contact (optional)</label>
        <input
          className="inp"
          value={poc}
          placeholder="Mike, service writer — (210) 555-0000"
          onChange={(e) => setPoc(e.target.value)}
        />
      </div>
      <div className="grid2">
        <div className="field">
          <label className="lab">Status</label>
          <select className="sel" value={statusId} onChange={(e) => setStatus(e.target.value)}>
            {statuses.map((s) => <option key={s.id} value={s.id}>{s.label}</option>)}
          </select>
        </div>
        <div className="field">
          <label className="lab">Date reported</label>
          <input className="inp" type="date" value={when} onChange={(e) => setWhen(e.target.value)} />
        </div>
      </div>
      <div className="field">
        <label className="lab">First follow-up reminder</label>
        <select className="sel" value={remind} onChange={(e) => setRemind(e.target.value)}>
          <option value="0">No reminder</option>
          {PRESETS.map((p) => <option key={p.m} value={p.m}>Alarm in {p.label}</option>)}
          <option value="date">On a specific date…</option>
        </select>
        {remind === "date" && (
          <div style={{ marginTop: 8 }}>
            <input className="inp" type="datetime-local" value={remindAt} onChange={(e) => setRemindAt(e.target.value)} />
            <label className="meta" style={{ display: "flex", gap: 6, alignItems: "flex-start", marginTop: 7 }}>
              <input type="checkbox" checked={parkIt} onChange={(e) => setParkIt(e.target.checked)} style={{ marginTop: 3 }} />
              <span>Park it — keep off the active board until then, like a unit with no update due until Thursday.</span>
            </label>
          </div>
        )}
      </div>
      {err && <div className="err">{err}</div>}
      <div className="foot">
        <button className="btn alt" onClick={onClose}>Cancel</button>
        <button className="btn" onClick={save}>Add to board</button>
      </div>
    </Sheet>
  );
}

function WhoAmI({ name, team = [], repairs = [], onSave, onAdd, onRemove, onClose }) {
  const [n, setN] = useState(name || "");
  const [add, setAdd] = useState("");
  const held = (who) => repairs.filter((r) => claimedBy(r).toLowerCase() === who.toLowerCase()).length;

  return (
    <Sheet title="Who's using this board?" onClose={onClose}>
      <div className="field">
        <label className="lab">Your name</label>
        <div style={{ display: "flex", gap: 8 }}>
          <input
            className="inp"
            value={n}
            placeholder="Andrea"
            autoFocus
            onChange={(e) => setN(e.target.value)}
            onKeyDown={(e) => e.key === "Enter" && n.trim() && onSave(n.trim())}
          />
          <button className="btn" disabled={!n.trim()} onClick={() => onSave(n.trim())}>Save</button>
        </div>
        <div className="meta" style={{ marginTop: 7 }}>
          Stamped on claims and follow-ups so the trail shows who did what. Saved on this device — Roger
          sets his own on his.
        </div>
        {team.length > 0 && (
          <div style={{ marginTop: 8, display: "flex", gap: 6, flexWrap: "wrap", alignItems: "center" }}>
            <span className="meta">Or pick yourself:</span>
            {team.map((t) => (
              <button key={t} className="btn alt sm" onClick={() => onSave(t)}>{t}</button>
            ))}
          </div>
        )}
      </div>

      <label className="lab" style={{ marginTop: 18 }}>People who can be assigned units</label>
      <div className="meta">Shared with everyone on the board, so anyone can hand a unit to anyone here.</div>
      <div style={{ display: "flex", gap: 8, marginTop: 8 }}>
        <input
          className="inp"
          value={add}
          placeholder="Add a name"
          onChange={(e) => setAdd(e.target.value)}
          onKeyDown={(e) => { if (e.key === "Enter" && add.trim()) { onAdd(add.trim()); setAdd(""); } }}
        />
        <button className="btn alt" disabled={!add.trim()} onClick={() => { onAdd(add.trim()); setAdd(""); }}>
          Add
        </button>
      </div>
      {team.length === 0 ? (
        <div className="meta" style={{ marginTop: 8 }}>Nobody added yet.</div>
      ) : (
        <div className="roster">
          {team.map((t) => {
            const count = held(t);
            const isYou = name && t.toLowerCase() === name.toLowerCase();
            return (
              <div className="roster-row" key={t}>
                <span className={"claim ro " + (isYou ? "mine" : "other")}>
                  <span className="av">{initials(t)}</span>
                  {t}
                </span>
                {isYou && <span className="meta">that's you</span>}
                <span className="meta" style={{ marginLeft: "auto" }}>
                  {count > 0 ? count + " unit" + (count === 1 ? "" : "s") + " claimed" : "nothing claimed"}
                </span>
                <button
                  className="btn danger sm"
                  disabled={count > 0}
                  title={count > 0 ? "Release or reassign their units first" : "Remove from the list"}
                  onClick={() => onRemove(t)}
                >
                  Remove
                </button>
              </div>
            );
          })}
        </div>
      )}

      <div className="foot" style={{ marginTop: 14 }}>
        <button className="btn alt" onClick={onClose}>Done</button>
      </div>
    </Sheet>
  );
}

function Vendors({ vendors, repairs, onAdd, onRemove, onRename, onClose }) {
  const [editing, setEditing] = useState(null);
  const [draft, setDraft] = useState({ name: "", phone: "", city: CITIES[0], where: "", address: "" });
  const commitEdit = (v) => {
    if (!draft.name.trim()) return;
    onRename(v.id, {
      name: draft.name.trim(),
      phone: draft.phone.trim(),
      city: draft.city,
      where: draft.city === OTR ? draft.where.trim() : "",
      address: draft.address.trim(),
    });
    setEditing(null);
  };
  const [name, setName] = useState("");
  const [city, setCity] = useState(LOCATIONS[0]);
  const [phone, setPhone] = useState("");
  const [where, setWhere] = useState("");
  const [address, setAddress] = useState("");
  const [err, setErr] = useState("");
  const isOtr = city === OTR;

  const add = () => {
    if (!name.trim()) return setErr("Enter the shop name.");
    onAdd({ id: uid("v"), name: name.trim(), city, phone: phone.trim(), where: isOtr ? where.trim() : "", address: address.trim() });
    setName(""); setPhone(""); setWhere(""); setAddress(""); setErr("");
  };

  return (
    <Sheet title="Shops and vendors" onClose={onClose} wide>
      <div className="grid2">
        <div className="field">
          <label className="lab">Shop name</label>
          <input className="inp" value={name} placeholder="Alamo Diesel & Brake" onChange={(e) => setName(e.target.value)} />
        </div>
        <div className="field">
          <label className="lab">Location</label>
          <select className="sel" value={city} onChange={(e) => setCity(e.target.value)}>
            {CITIES.map((c) => <option key={c} value={c}>{c}</option>)}
            <option value={OTR}>OTR — road service</option>
          </select>
        </div>
      </div>
      <div className="grid2">
        <div className="field">
          <label className="lab">Phone (optional)</label>
          <input className="inp" value={phone} placeholder="(210) 555-0148" onChange={(e) => setPhone(e.target.value)} />
        </div>
        {isOtr && (
          <div className="field">
            <label className="lab">Coverage area (optional)</label>
            <input className="inp" value={where} placeholder="I-10 corridor, West TX" onChange={(e) => setWhere(e.target.value)} />
          </div>
        )}
      </div>
      <div className="field">
        <label className="lab">Street address (optional)</label>
        <input
          className="inp"
          value={address}
          placeholder="4815 Interstate 10 E, San Antonio, TX 78219"
          onChange={(e) => setAddress(e.target.value)}
        />
      </div>
      {err && <div className="err">{err}</div>}
      <div className="foot" style={{ marginBottom: 18 }}>
        <button className="btn" onClick={add}>Add shop</button>
      </div>

      {LOCATIONS.map((c) => {
        const list = vendors.filter((v) => v.city === c);
        return (
          <div key={c} style={{ marginBottom: 14 }}>
            <label className="lab">{c === OTR ? "OTR — road service" : c}</label>
            {list.length === 0 ? (
              <div className="meta">No shops yet.</div>
            ) : (
              <div className="list">
                {list.map((v) => {
                  const inUse = repairs.filter((r) => r.vendorId === v.id).length;
                  if (editing === v.id) {
                    return (
                      <div className="list-row edit" key={v.id}>
                        <div className="vedit">
                          <div>
                            <label className="lab">Shop name</label>
                            <input className="inp" value={draft.name} autoFocus onChange={(e) => setDraft({ ...draft, name: e.target.value })} />
                          </div>
                          <div>
                            <label className="lab">Phone</label>
                            <input
                              className="inp"
                              value={draft.phone}
                              placeholder="(210) 555-0148"
                              onChange={(e) => setDraft({ ...draft, phone: e.target.value })}
                              onKeyDown={(e) => e.key === "Enter" && commitEdit(v)}
                            />
                          </div>
                          <div>
                            <label className="lab">Location</label>
                            <select className="sel" value={draft.city} onChange={(e) => setDraft({ ...draft, city: e.target.value })}>
                              {CITIES.map((x) => <option key={x} value={x}>{x}</option>)}
                              <option value={OTR}>OTR — road service</option>
                            </select>
                          </div>
                          {draft.city === OTR && (
                            <div>
                              <label className="lab">Coverage area</label>
                              <input className="inp" value={draft.where} placeholder="I-10 corridor, West TX" onChange={(e) => setDraft({ ...draft, where: e.target.value })} />
                            </div>
                          )}
                          <div>
                            <label className="lab">Street address</label>
                            <input
                              className="inp"
                              value={draft.address}
                              placeholder="4815 Interstate 10 E, San Antonio, TX 78219"
                              onChange={(e) => setDraft({ ...draft, address: e.target.value })}
                            />
                          </div>
                          <div className="vedit-foot">
                            {draft.city !== v.city && inUse > 0 && (
                              <span className="meta">
                                Moves {inUse} unit{inUse === 1 ? "" : "s"} to {draft.city === OTR ? "OTR" : draft.city}.
                              </span>
                            )}
                            <button className="btn alt sm" onClick={() => setEditing(null)}>Cancel</button>
                            <button className="btn sm" disabled={!draft.name.trim()} onClick={() => commitEdit(v)}>Save shop</button>
                          </div>
                        </div>
                      </div>
                    );
                  }
                  return (
                    <div className="list-row" key={v.id}>
                      <div>
                        <div className="nm">{v.name}</div>
                        <div className="sub mono">
                          {v.phone || "no phone on file"}
                          {v.where ? " · " + v.where : ""}
                        </div>
                        {v.address && (
                          <div className="sub">
                            <a className="addr" href={mapsUrl(v.address)} target="_blank" rel="noreferrer" title="Open in Google Maps">
                              📍 {v.address}
                            </a>
                          </div>
                        )}
                      </div>
                      <div style={{ marginLeft: "auto", display: "flex", gap: 8, alignItems: "center" }}>
                        {inUse > 0 && <span className="meta">{inUse} unit{inUse === 1 ? "" : "s"} here</span>}
                        <button
                          className="btn alt sm"
                          onClick={() => {
                            setEditing(v.id);
                            setDraft({ name: v.name || "", phone: v.phone || "", city: v.city || CITIES[0], where: v.where || "", address: v.address || "" });
                          }}
                        >
                          Edit
                        </button>
                        <button
                          className="btn danger sm"
                          disabled={inUse > 0}
                          title={inUse > 0 ? "Move its units to another shop first" : "Remove shop"}
                          onClick={() => onRemove(v.id)}
                        >
                          Remove
                        </button>
                      </div>
                    </div>
                  );
                })}
              </div>
            )}
          </div>
        );
      })}
    </Sheet>
  );
}

          <label className="lab">Colour band</label>
          <select className="sel" value={tone} onChange={(e) => setTone(e.target.value)}>

function RepairedPage({ archive, vendors, me, onRestore, onPurge, onPatch, onBack }) {
  const [open, setOpen] = useState(null);
  const [only, setOnly] = useState("all"); // all | missing
  const [q, setQ] = useState("");
  const vname = (id) => (vendors.find((v) => v.id === id) || { name: "Pending shop" }).name;

  const rows = useMemo(() => {
    const needle = q.trim().toLowerCase();
    return archive.filter((r) => {
      if (only === "missing" && paperworkComplete(r)) return false;
      if (!needle) return true;
      return [r.unitNumber, r.issue, vname(r.vendorId), r.approver, r.city]
        .join(" ")
        .toLowerCase()
        .includes(needle);
    });
  }, [archive, only, q, vendors]);

  const short = archive.filter((r) => !paperworkComplete(r)).length;

  /* one row per completed repair, built for a spreadsheet — the paperwork
     columns are YES/NO so they pivot and filter cleanly */
  const exportRows = (list) => {
    const head = [
      "Unit", "Unit type", "Ownership", "Partner carrier", "Shop", "City", "Breakdown location",
      "Issue", "Closing note", "Priority", "Reported", "Repaired", "Hours down",
      "Handled by", "Approved by", "POC", "Requested by", "Driver who reported",
      "Invoice on file", "Receipt on file", "Photo/video on file", "Paperwork complete",
      "Invoice total", "Over $150 cap", "Overage approved by", "Follow-ups", "Files",
    ];
    const body = list.map((r) => [
      r.unitNumber,
      r.unitType,
      tracksOwnership(r) ? ownOf(r) : "",
      onPartner(r) ? partnerName(r) || "YES" : "",
      vname(r.vendorId),
      r.city,
      r.location || "",
      r.issue,
      r.closeNote || "",
      prioOf(r) + " — " + PRIO_LABEL[prioOf(r)],
      stampDate(r.reportedAt),
      stamp(r.repairedAt),
      Math.max(0, Math.round(hoursSince(r.reportedAt) - hoursSince(r.repairedAt))),
      r.claimedBy || "",
      r.approver || "",
      r.poc || "",
      r.requestedBy || "",
      r.driver || "",
      hasKind(r, "invoice") ? "YES" : "NO",
      hasKind(r, "receipt") ? "YES" : "NO",
      hasKind(r, "photo", "video") ? "YES" : "NO",
      paperworkComplete(r) ? "YES" : "NO",
      invoiceTotal(r) > 0 ? invoiceTotal(r).toFixed(2) : "",
      onPartner(r) ? (partnerOver(r) ? "YES" : "NO") : "",
      r.partnerApprovedBy || "",
      (r.followUps || []).length,
      (r.files || []).map((f) => f.kind + ": " + f.name).join("; "),
    ]);
    return csvRows([head, ...body]);
  };

  const exportNow = () => {
    const list = rows.length ? rows : archive;
    downloadCsv(
      "repairs-completed-" + (only === "missing" ? "missing-paperwork-" : "") + fileStamp() + ".csv",
      exportRows(list)
    );
  };

  return (
    <div className="page">
      <div className="page-hd">
        <button className="btn ghost sm" onClick={onBack}>← Back to the board</button>
        <h2>Repaired — paperwork</h2>
        <span className="meta">
          {archive.length} completed{short > 0 ? " · " + short + " missing paperwork" : " · all complete"}
        </span>
        <span className="spacer" />
        <div className="seg-ctl">
          <button aria-pressed={only === "all"} onClick={() => setOnly("all")}>All ({archive.length})</button>
          <button aria-pressed={only === "missing"} onClick={() => setOnly("missing")}>
            Missing ({short})
          </button>
        </div>
        <input
          className="inp search"
          placeholder="Search unit, shop, issue…"
          value={q}
          onChange={(e) => setQ(e.target.value)}
        />
        <button
          className="btn sm"
          disabled={archive.length === 0}
          title="Download these repairs as a CSV you can open in Excel or Google Sheets"
          onClick={exportNow}
        >
          ⭳ Export CSV{rows.length !== archive.length ? " (" + rows.length + ")" : ""}
        </button>
      </div>

      {archive.length === 0 ? (
        <div className="empty">
          <strong>Nothing repaired yet</strong>
          Units land here when you mark them repaired on the board.
        </div>
      ) : rows.length === 0 ? (
        <div className="empty">
          <strong>{only === "missing" ? "Every repair has its paperwork" : "Nothing matches that search"}</strong>
          {only === "missing" ? "Invoice, photo or video, receipt, and an approver are all on file." : "Try a different unit or shop."}
        </div>
      ) : (
        <div className="rp-list">
          {rows.map((r) => {
            const gaps = missingPaperwork(r);
            const expanded = open === r.id;
            return (
              <div className={"rp" + (gaps.length ? " short" : "")} key={r.id}>
                <div className="rp-main">
                  <span className="rp-unit mono">{r.unitNumber}</span>
                  {tracksOwnership(r) && (
                    <span className={"own " + (onPartner(r) ? "partner" : OWN_CLASS[ownOf(r)])}>
                      {onPartner(r) ? "PARTNER" : OWN_LABEL[ownOf(r)]}
                    </span>
                  )}
                  <span className={"kind " + r.unitType.toLowerCase()}>{r.unitType}</span>
                  <span className="rp-where">
                    {vname(r.vendorId)} · {r.city === OTR ? r.location || "OTR" : r.city}
                  </span>
                  <span className="rp-issue">{r.issue}</span>
                  <span className="spacer" />
                  <span className="rp-when mono">repaired {stamp(r.repairedAt)}</span>
                </div>

                <div className="rp-docs">
                  {PAPERWORK.map((doc) => {
                    const ok = doc.has(r);
                    return (
                      <span key={doc.id} className={"pw " + (ok ? "ok" : "miss")} title={ok ? doc.label + " on file" : doc.label + " still needed"}>
                        <i className={ok ? "dot-ok" : "dot-miss"} />
                        {doc.label}
                        {doc.id === "approver" && ok ? ": " + r.approver : ""}
                      </span>
                    );
                  })}
                  {gaps.length > 0 && (
                    <span className="pw-alert">⚠ {gaps.length} missing</span>
                  )}
                  <span className="spacer" />
                  <button className="btn alt sm" onClick={() => setOpen(expanded ? null : r.id)}>
                    {expanded ? "Close" : gaps.length ? "Upload what's missing" : "View files"}
                  </button>
                  <button className="btn alt sm" onClick={() => onRestore(r.id)}>Put back</button>
                  <button
                    className="btn danger sm"
                    onClick={() => window.confirm("Delete " + r.unitNumber + " and its files from the repaired list?") && onPurge(r.id)}
                  >
                    Delete
                  </button>
                </div>

                {expanded && (
                  <div className="rp-open">
                    <div className="dgrid">
                      <div>
                        <label className="lab">Approved by</label>
                        <input
                          className="inp"
                          value={r.approver || ""}
                          placeholder="Who signed off on this repair"
                          onChange={(e) => onPatch(r.id, { approver: e.target.value })}
                        />
                      </div>
                      <div>
                        <label className="lab">Closing note</label>
                        <input
                          className="inp"
                          value={r.closeNote || ""}
                          placeholder="What finally fixed it"
                          onChange={(e) => onPatch(r.id, { closeNote: e.target.value })}
                        />
                      </div>
                    </div>
                    <Attachments r={r} me={me} onPatch={(patch) => onPatch(r.id, patch)} />
                    <div className="sub mono" style={{ marginTop: 10 }}>
                      reported {stampDate(r.reportedAt)} · down{" "}
                      {Math.max(0, Math.round(hoursSince(r.reportedAt) - hoursSince(r.repairedAt)))}h
                      {r.claimedBy ? " · handled by " + r.claimedBy : ""}
                    </div>
                  </div>
                )}
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

function ExportCsv({ repairs, archive, vendorOf, statusOf, onClose }) {
  const [copied, setCopied] = useState(false);
  const csv = useMemo(() => {
    const head = ["Location", "Breakdown location", "Shop", "Shop address", "POC", "Priority", "Unit type", "Unit number", "Ownership", "Lessor / rental co", "Partner carrier", "Invoice total", "Within $150 cap", "Overage approved by", "Issue", "Status", "Approved by", "Requested by", "Driver who reported", "Safe to drive", "Loaded trailer", "Delivery", "Reported", "Last follow-up", "Follow-ups", "Claimed by", "Reminder due", "Parked", "Files", "Hours down", "Repaired"];
    const esc = (v) => '"' + String(v == null ? "" : v).replace(/"/g, '""') + '"';
    const line = (r, done) =>
      [
        r.city,
        r.location || "",
        vendorOf(r.vendorId).name,
        vendorOf(r.vendorId).address || "",
        r.poc || "",
        prioOf(r) + " — " + PRIO_LABEL[prioOf(r)],
        r.unitType,
        r.unitNumber,
        ownOf(r),
        r.lessor || "",
        onPartner(r) ? partnerName(r) || "YES" : "",
        invoiceTotal(r) > 0 ? invoiceTotal(r).toFixed(2) : "",
        onPartner(r) ? (partnerFlagged(r) ? "FLAGGED — over" : r.partnerCapOk ? "YES" : partnerCleared(r) ? "over, approved" : "not confirmed") : "",
        r.partnerApprovedBy || "",
        r.issue,
        statusOf(r.statusId).label,
        r.approver || "",
        r.requestedBy || "",
        r.driver || "",
        r.safeToDrive === false ? "NO" : r.safeToDrive === true ? "YES" : "",
        r.loadedTrailer ? "YES" : "NO",
        r.deliveryAt ? stamp(r.deliveryAt) : "",
        stampDate(r.reportedAt),
        r.followUps && r.followUps.length ? stamp(lastTouch(r)) : "none",
        (r.followUps || []).length,
        claimedBy(r),
        r.dueAt ? stamp(r.dueAt) : "",
        isParked(r) ? "Parked" : "",
        (r.files || []).map((f) => f.name).join("; "),
        done ? Math.round(hoursSince(r.reportedAt) - hoursSince(r.repairedAt)) : Math.round(hoursSince(r.reportedAt)),
        done ? stamp(r.repairedAt) : "",
      ].map(esc).join(",");
    return [head.map(esc).join(","), ...repairs.map((r) => line(r, false)), ...archive.map((r) => line(r, true))].join("\n");
  }, [repairs, archive]);

  const copy = async () => {
    try {
      await navigator.clipboard.writeText(csv);
      setCopied(true);
      setTimeout(() => setCopied(false), 1800);
    } catch (e) {
      setCopied(false);
    }
  };

  return (
    <Sheet title="Export the board" onClose={onClose} wide>
      <div className="meta" style={{ marginBottom: 8 }}>
        Open units first, then everything already repaired. Copy this into a spreadsheet.
      </div>
      <textarea className="ta mono" style={{ minHeight: 240, fontSize: 12 }} readOnly value={csv} onFocus={(e) => e.target.select()} />
      <div className="foot">
        <button className="btn alt" onClick={copy}>{copied ? "Copied" : "Copy CSV"}</button>
        <button className="btn" onClick={() => downloadCsv("repair-board-" + fileStamp() + ".csv", csv)}>
          ⭳ Download CSV
        </button>
      </div>
    </Sheet>
  );
}
