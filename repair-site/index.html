<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Repair CT Dashboard — retired</title>
<style>
  :root{ color-scheme: dark; }
  body{
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:#0E1620; color:#EEF1F5; padding:24px;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; line-height:1.55;
  }
  .card{ max-width:520px; text-align:center; }
  .mark{
    width:56px; height:56px; border-radius:16px; background:#1B2A3A; color:#8FA6BC;
    display:flex; align-items:center; justify-content:center; font-size:26px; margin:0 auto 18px;
  }
  h1{ font-size:22px; margin:0 0 10px; letter-spacing:.01em; }
  p{ margin:0 0 12px; color:#A9B8C8; font-size:14.5px; }
  .note{ font-size:13px; color:#6E8298; margin-top:18px; }
</style>
</head>
<body>
  <div class="card">
    <div class="mark">&#128295;</div>
    <h1>The Repair CT Dashboard has been retired</h1>
    <p>This board is no longer in service. Please use your team's current process for tracking units that are down.</p>
    <p class="note">Records from the board were retained and can be restored if needed. Contact Derrick with any questions.</p>
  </div>
</body>
</html>
