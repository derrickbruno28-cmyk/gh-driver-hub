# Auto-deploy the Driver Hub to Firebase Hosting whenever code lands on `main`.
# This replaced the old "push to main -> Netlify deploys" flow.
#
#   hub -> public/ -> https://ghlogistics-driver-hub.firebaseapp.com
#
# The Repair CT Dashboard was retired on 2026-08-12. Its hosting site
# (fleet-repair-ctdashboard) is no longer deployed to and now serves a
# retirement notice; the app source is kept at
# archive/repair-ct-dashboard/index.html.
#
# One-time setup (done in web consoles, no terminal needed):
#   1. Firebase console -> Project settings -> Service accounts ->
#      "Generate new private key" -> downloads a .json file.
#   2. GitHub repo -> Settings -> Secrets and variables -> Actions ->
#      "New repository secret":
#        Name:  FIREBASE_SERVICE_ACCOUNT_GHLOGISTICS
#        Value: paste the entire contents of that .json file

name: Deploy to Firebase Hosting on merge

on:
  push:
    branches:
      - main

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy Driver Hub
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_GHLOGISTICS }}
          channelId: live
          projectId: ghlogistics-driver-hub
          target: hub
