<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GH Logistics Driver Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f4f6fb;
    --surface: #ffffff;
    --surface2: #eef1f8;
    --border: #e2e7f0;
    --text: #1e2333;
    --text2: #6b7384;
    --primary: #5b5bd6;
    --primary-soft: #ececfb;
    --teal: #0d9488;
    --green: #16a34a;
    --green-soft: #e6f6ec;
    --amber: #d97706;
    --amber-soft: #fdf0dd;
    --red: #dc2626;
    --red-soft: #fcebec;
    --blue: #2563eb;
    --blue-soft: #e7eefc;
    --slate: #64748b;
    --slate-soft: #eef1f5;
    --shadow: 0 1px 2px rgba(16,24,40,.04), 0 4px 14px rgba(16,24,40,.06);
    --font: 'Inter', system-ui, -apple-system, sans-serif;
    --radius: 14px;
  }
  body.dark {
    --bg: #0f1320;
    --surface: #171c2c;
    --surface2: #1f2638;
    --border: #2a3145;
    --text: #e8ecf5;
    --text2: #99a2b8;
    --primary: #8b8bf0;
    --primary-soft: #262657;
    --green-soft: #133121;
    --amber-soft: #3a2a10;
    --red-soft: #3a1c1e;
    --blue-soft: #16294d;
    --slate-soft: #232a3a;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.35);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: var(--font); height: 100vh; overflow: hidden; -webkit-font-smoothing: antialiased; }
  .app { display: flex; height: 100vh; }

  /* Sidebar */
  .sidebar { width: 244px; min-width: 244px; background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; }
  .brand { padding: 20px 20px 16px; display: flex; align-items: center; gap: 11px; }
  .brand .mark { width: 34px; height: 34px; border-radius: 10px; background: var(--primary); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 18px; }
  .brand h1 { font-size: 15px; font-weight: 700; letter-spacing: -.01em; }
  .brand span { font-size: 11px; color: var(--text2); display: block; }
  .nav { flex: 1; padding: 6px 12px; overflow-y: auto; }
  .nav-group { font-size: 10px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--text2); padding: 14px 10px 6px; }
  .nav-item { display: flex; align-items: center; gap: 11px; padding: 9px 12px; border-radius: 9px; cursor: pointer; font-size: 13.5px; font-weight: 500; color: var(--text2); transition: .12s; margin-bottom: 1px; }
  .nav-item:hover { background: var(--surface2); color: var(--text); }
  .nav-item.active { background: var(--primary-soft); color: var(--primary); }
  .nav-item .ic { font-size: 16px; width: 20px; text-align: center; }
  .nav-item .ct { margin-left: auto; font-size: 11px; font-weight: 600; background: var(--surface2); color: var(--text2); padding: 1px 8px; border-radius: 20px; }
  .nav-item.active .ct { background: rgba(91,91,214,.18); color: var(--primary); }
  .sb-foot { padding: 12px; border-top: 1px solid var(--border); }

  /* Main */
  .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  .topbar { display: flex; align-items: center; gap: 14px; padding: 16px 26px; border-bottom: 1px solid var(--border); background: var(--surface); }
  .topbar h2 { font-size: 18px; font-weight: 700; letter-spacing: -.02em; }
  .topbar .sub { font-size: 12.5px; color: var(--text2); margin-top: 1px; }
  .search { flex: 1; max-width: 420px; margin-left: auto; position: relative; }
  .search input { width: 100%; padding: 9px 12px 9px 36px; border: 1px solid var(--border); border-radius: 10px; background: var(--bg); color: var(--text); font-family: var(--font); font-size: 13.5px; outline: none; }
  .search input:focus { border-color: var(--primary); }
  .search .si { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text2); font-size: 14px; }
  .content { flex: 1; overflow-y: auto; padding: 24px 26px 60px; }

  /* Buttons */
  .btn { padding: 9px 15px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface); color: var(--text); font-family: var(--font); font-size: 13px; font-weight: 600; cursor: pointer; transition: .12s; display: inline-flex; align-items: center; gap: 7px; }
  .btn:hover { background: var(--surface2); }
  .btn-primary { background: var(--primary); border-color: var(--primary); color: #fff; }
  .btn-primary:hover { filter: brightness(1.07); background: var(--primary); }
  .btn-danger { color: var(--red); border-color: var(--red-soft); background: var(--red-soft); }
  .btn-sm { padding: 5px 10px; font-size: 12px; border-radius: 8px; }
  .icon-btn { width: 38px; height: 38px; padding: 0; justify-content: center; }

  /* Cards / stats */
  .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 14px; margin-bottom: 22px; }
  .stat { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px 18px; box-shadow: var(--shadow); }
  .stat .lbl { font-size: 12px; color: var(--text2); font-weight: 500; display: flex; align-items: center; gap: 7px; }
  .stat .num { font-size: 28px; font-weight: 700; letter-spacing: -.02em; margin-top: 8px; }
  .stat .meta { font-size: 11.5px; color: var(--text2); margin-top: 3px; }
  .stat .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); margin-bottom: 20px; overflow: hidden; }
  .card-head { padding: 15px 18px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px; }
  .card-head h3 { font-size: 14.5px; font-weight: 700; }
  .card-head .ct { font-size: 11.5px; color: var(--text2); font-weight: 600; background: var(--surface2); padding: 2px 9px; border-radius: 20px; }
  .card-body { padding: 6px 0; }
  .card-pad { padding: 18px; }

  /* Two-col layout */
  .cols { display: grid; grid-template-columns: 1.4fr 1fr; gap: 20px; align-items: start; }
  @media (max-width: 1100px){ .cols { grid-template-columns: 1fr; } }

  /* Filter chips */
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
  .chip { padding: 7px 13px; border-radius: 20px; border: 1px solid var(--border); background: var(--surface); color: var(--text2); font-size: 12.5px; font-weight: 600; cursor: pointer; transition: .12s; }
  .chip:hover { color: var(--text); }
  .chip.active { background: var(--primary); border-color: var(--primary); color: #fff; }

  /* Table */
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--text2); padding: 11px 16px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  td { padding: 12px 16px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  tr:last-child td { border-bottom: none; }
  tbody tr { cursor: pointer; transition: .1s; }
  tbody tr:hover { background: var(--surface2); }
  .who { display: flex; align-items: center; gap: 11px; }
  .ava { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 12.5px; color: #fff; flex-shrink: 0; }
  .who .nm { font-weight: 600; }
  .who .sm { font-size: 11.5px; color: var(--text2); }

  /* Badges */
  .badge { display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px; border-radius: 20px; font-size: 11.5px; font-weight: 600; white-space: nowrap; }
  .b-green { background: var(--green-soft); color: var(--green); }
  .b-amber { background: var(--amber-soft); color: var(--amber); }
  .b-red { background: var(--red-soft); color: var(--red); }
  .b-blue { background: var(--blue-soft); color: var(--blue); }
  .b-slate { background: var(--slate-soft); color: var(--slate); }
  .b-primary { background: var(--primary-soft); color: var(--primary); }
  .tag { display: inline-block; padding: 2px 9px; border-radius: 7px; font-size: 11px; font-weight: 600; background: var(--surface2); color: var(--text2); }

  .empty { text-align: center; padding: 50px 20px; color: var(--text2); }
  .empty .ei { font-size: 40px; opacity: .5; }
  .empty p { margin-top: 10px; font-size: 13.5px; }

  /* Pair card */
  .pair { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 14px; padding: 16px 18px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); box-shadow: var(--shadow); }
  .pair .link { color: var(--text2); font-size: 18px; text-align: center; }
  .person { display: flex; align-items: center; gap: 11px; }
  .pair-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px,1fr)); gap: 16px; }

  /* List rows */
  .lrow { display: flex; align-items: center; gap: 14px; padding: 13px 18px; border-bottom: 1px solid var(--border); }
  .lrow:last-child { border-bottom: none; }
  .lrow .body { flex: 1; }
  .lrow .body .t { font-weight: 600; font-size: 13.5px; }
  .lrow .body .d { font-size: 12.5px; color: var(--text2); margin-top: 2px; }

  /* Modal */
  .overlay { position: fixed; inset: 0; background: rgba(15,19,32,.55); backdrop-filter: blur(3px); display: none; align-items: center; justify-content: center; z-index: 100; padding: 20px; }
  .overlay.open { display: flex; }
  .modal { background: var(--surface); border-radius: 18px; width: 720px; max-width: 100%; max-height: 92vh; display: flex; flex-direction: column; box-shadow: 0 20px 60px rgba(0,0,0,.3); }
  .modal-head { padding: 20px 24px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; }
  .modal-head h3 { font-size: 16px; font-weight: 700; flex: 1; }
  .modal-body { padding: 22px 24px; overflow-y: auto; }
  .modal-foot { padding: 16px 24px; border-top: 1px solid var(--border); display: flex; gap: 10px; justify-content: flex-end; }
  .x { width: 34px; height: 34px; border-radius: 9px; border: 1px solid var(--border); background: transparent; color: var(--text2); cursor: pointer; font-size: 17px; }
  .x:hover { background: var(--surface2); }

  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .fld { display: flex; flex-direction: column; gap: 6px; }
  .fld.full { grid-column: 1 / -1; }
  .fld label { font-size: 11.5px; font-weight: 600; color: var(--text2); text-transform: uppercase; letter-spacing: .03em; }
  .fld input, .fld select, .fld textarea { padding: 9px 11px; border: 1px solid var(--border); border-radius: 9px; background: var(--bg); color: var(--text); font-family: var(--font); font-size: 13.5px; outline: none; }
  .fld input:focus, .fld select:focus, .fld textarea:focus { border-color: var(--primary); }
  .fld textarea { resize: vertical; min-height: 70px; }
  .sec-label { grid-column: 1/-1; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--primary); margin-top: 8px; padding-top: 14px; border-top: 1px solid var(--border); }

  /* Doc chips */
  .docs { display: flex; flex-direction: column; gap: 8px; }
  .doc { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border: 1px solid var(--border); border-radius: 9px; background: var(--bg); font-size: 13px; }
  .doc .fi { font-size: 16px; }
  .doc .dn { flex: 1; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .doc .ds { font-size: 11px; color: var(--text2); }
  .doc a, .doc .rm { color: var(--text2); text-decoration: none; cursor: pointer; padding: 2px 6px; border-radius: 6px; }
  .doc a:hover { color: var(--primary); }
  .doc .rm:hover { color: var(--red); }
  .upload { border: 1.5px dashed var(--border); border-radius: 11px; padding: 18px; text-align: center; color: var(--text2); cursor: pointer; font-size: 13px; transition: .12s; }
  .upload:hover { border-color: var(--primary); color: var(--primary); background: var(--primary-soft); }

  .mini-add { display: grid; grid-template-columns: 1fr 1fr auto; gap: 8px; align-items: end; margin-top: 12px; }
  .sub-list { margin-top: 12px; display: flex; flex-direction: column; gap: 7px; }
  .sub-item { display: flex; align-items: center; gap: 10px; padding: 8px 11px; background: var(--bg); border: 1px solid var(--border); border-radius: 9px; font-size: 12.5px; }
  .sub-item .si-x { margin-left: auto; cursor: pointer; color: var(--text2); }
  .sub-item .si-x:hover { color: var(--red); }

  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 11px 20px; border-radius: 11px; font-size: 13.5px; font-weight: 600; box-shadow: var(--shadow); opacity: 0; pointer-events: none; transition: .2s; z-index: 200; }
  .toast.show { opacity: 1; }
  .preview-banner { background: var(--amber-soft); color: var(--amber); font-size: 12px; font-weight: 600; text-align: center; padding: 7px; }
  .due { font-weight: 700; }
  .due.urgent { color: var(--red); }
  .due.soon { color: var(--amber); }
  .due.ok { color: var(--green); }

  /* SOP collapsibles */
  details.sop { border: 1px solid var(--border); border-radius: 11px; background: var(--bg); overflow: hidden; }
  details.sop summary { display: flex; align-items: center; gap: 10px; padding: 13px 16px; cursor: pointer; font-weight: 600; font-size: 14px; list-style: none; }
  details.sop summary::-webkit-details-marker { display: none; }
  details.sop summary span { flex: 1; }
  details.sop summary::before { content: '▸'; color: var(--text2); font-size: 12px; }
  details.sop[open] summary::before { content: '▾'; }
  details.sop .sop-body { padding: 4px 18px 16px 34px; font-size: 13.5px; color: var(--text2); line-height: 1.7; }
  /* Call attempt add row */
  .att-add { display: grid; grid-template-columns: 1.1fr 1fr 1.2fr 1.4fr auto; gap: 8px; align-items: end; }
  .att-add input, .att-add select { padding: 8px 10px; border: 1px solid var(--border); border-radius: 9px; background: var(--bg); color: var(--text); font-family: var(--font); font-size: 13px; }
  @media (max-width: 720px){ .att-add { grid-template-columns: 1fr 1fr; } }
  /* Pay table editor */
  table.pay-edit input { width: 100%; padding: 7px 9px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); color: var(--text); font-family: var(--font); font-size: 13px; }
  table.pay-edit th, table.pay-edit td { padding: 6px 8px; }
  /* DQF checklist grid */
  .dqf-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  @media (max-width: 720px){ .dqf-grid { grid-template-columns: 1fr; } }
  .dqf-row { display: grid; grid-template-columns: 1fr 110px 130px; gap: 6px; align-items: center; padding: 6px 9px; background: var(--bg); border: 1px solid var(--border); border-radius: 9px; }
  .dqf-row .dqf-name { font-size: 12.5px; font-weight: 500; }
  .dqf-row select, .dqf-row input { padding: 5px 7px; border: 1px solid var(--border); border-radius: 7px; background: var(--surface); color: var(--text); font-size: 12px; font-family: var(--font); }
  /* Violation add row */
  .vio-add { display: grid; grid-template-columns: 1fr 1.2fr 1fr 1fr 1fr auto; gap: 8px; align-items: end; }
  .vio-add input, .vio-add select { padding: 8px 10px; border: 1px solid var(--border); border-radius: 9px; background: var(--bg); color: var(--text); font-family: var(--font); font-size: 13px; }
  @media (max-width: 720px){ .vio-add { grid-template-columns: 1fr 1fr; } }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="mark">🚛</div>
      <div><h1>Driver Hub</h1><span>Fleet Management</span></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="sb-foot">
      <button class="btn" style="width:100%;justify-content:center" onclick="toggleTheme()"><span id="themeIcon">🌙</span> <span id="themeLbl">Dark mode</span></button>
    </div>
  </aside>
  <main class="main">
    <header class="topbar">
      <div>
        <h2 id="pageTitle">Dashboard</h2>
        <div class="sub" id="pageSub">Fleet overview</div>
      </div>
      <div class="search"><span class="si">🔍</span><input id="search" placeholder="Search drivers..." oninput="onSearch(this.value)"></div>
      <button class="btn btn-primary" onclick="openDriver(null)">＋ Add Driver</button>
    </header>
    <div class="content" id="content"></div>
  </main>
</div>

<div class="overlay" id="overlay"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ---------- Config ---------- */
const CITIES = ['San Antonio, TX', 'Dallas, TX', 'Memphis, TN'];
const CLASSIFICATIONS = [
  { name: 'Memphis HERO Teams',     city: 'Memphis, TN',     type: 'team' },
  { name: 'Dallas HERO Teams',      city: 'Dallas, TX',      type: 'team' },
  { name: 'Dallas OTR Teams',       city: 'Dallas, TX',      type: 'team' },
  { name: 'San Antonio OTR Teams',  city: 'San Antonio, TX', type: 'team' },
  { name: 'Memphis OTR Teams',      city: 'Memphis, TN',     type: 'team' },
  { name: 'San Antonio HERO Teams', city: 'San Antonio, TX', type: 'team' },

  { name: 'Solo Regional',          city: '',                type: 'solo' },
  { name: 'Local — San Antonio',    city: 'San Antonio, TX', type: 'local' },
  { name: 'Local — Dallas',         city: 'Dallas, TX',      type: 'local' },
  { name: 'Local — Memphis',        city: 'Memphis, TN',     type: 'local' },
];
const AVAILABILITY = ['Available', 'On Route', 'Home Time', 'Off Duty', 'Unavailable'];
const AVAIL_STYLE = { 'Available':'b-green', 'On Route':'b-blue', 'Home Time':'b-amber', 'Off Duty':'b-slate', 'Unavailable':'b-red' };
const AVATAR_COLORS = ['#5b5bd6','#0d9488','#2563eb','#d97706','#db2777','#7c3aed','#0891b2','#ca8a04'];

/* Recruitment dropdown options */
const POSITIONS = CLASSIFICATIONS.map(c=>c.name);
const RT_STATUS = ['Scheduled','Passed','Failed'];
const NHPW_OPTS = ['Pending','Signed'];
const I9_OPTS = ['Pending','Completed'];
const DT_OPTS = ['Results Pending','Completed'];
const ONB_OPTS = ['Pending','Completed'];
const DOT_OPTS = ['Pending','Completed'];
const GTG_OPTS = ['NO','YES'];
const RT_STYLE = { 'Scheduled':'b-blue','Passed':'b-green','Failed':'b-red' };
const TERM_TYPES = ['Resigned','Fired','Removed'];

/* Leads / recruiter call log */
const CALL_OUTCOMES = ['No Answer – Left Voicemail','No Answer – No Voicemail','Connected','Callback Requested','Not Interested','Wrong/Bad Number'];

const LEAD_STATUS_STYLE = { 'New':'b-blue','Attempting Contact':'b-amber','Contacted':'b-primary','Interested':'b-green','Not Interested':'b-slate','Unreachable':'b-red','Converted':'b-green' };

/* Editing the policy is restricted to these people once Firebase Auth is live */
const POLICY_EDITORS = ['derrick','anna','destiny','amanda'];

/* Admin — RSI insurance */

/* Admin — DQF */
const DQF_ITEMS = ['Application','CDL','Med Card','MVR','Clearinghouse','I-9','Pre-Employment Drug Test','RT Certificate','RT Checklist',"Provider's Check",'NHPW','PSP Report','Previous Employment','Background Check'];
const DQF_EXPIRES = ['CDL','Med Card'];

/* Safety — violations */
const VIO_SEVERITY = ['Minor','Moderate','Major','Critical'];
const VIO_STATUS = ['Open','Under Review','Resolved'];
const VIO_SEV_STYLE = { 'Minor':'b-slate','Moderate':'b-amber','Major':'b-red','Critical':'b-red' };

/* Safety — points memo & training */
const MEMO_STATUS = ['In Progress','Completed'];
const BLOCKER_ISSUES = ['Suspended CDL','Invalid Med Card'];
const TRAIN_STATUS = ['Assigned','Completed','Overdue'];
const TRAIN_STYLE = { 'Assigned':'b-amber','Completed':'b-green','Overdue':'b-red' };

const NAV = [
  { group: 'Overview' },
  { id:'dashboard', icon:'📊', label:'Dashboard' },
  { id:'master',    icon:'📇', label:'Master List' },
  { group: 'Status' },
  { id:'availability', icon:'🟢', label:'Availability' },
  { id:'timeoff',      icon:'🌴', label:'Time Off' },
  { id:'callouts',     icon:'📵', label:'Call-Out Log' },
  { id:'constraints',  icon:'⚠️', label:'Constraints' },
  { id:'returns',      icon:'🏠', label:'Return Dates' },
  { group: 'Roster' },
  { id:'pairings', icon:'👥', label:'Team Pairings' },
  { id:'solo',     icon:'🧍', label:'Solo Drivers' },
  { id:'programs', icon:'🗂️', label:'Programs' },
  { group: 'Recruitment' },
  { id:'leads',      icon:'📞', label:'Leads / Call Log' },
  { id:'roadtests', icon:'🛣️', label:'Road Tests / New Hires' },
  { id:'nmf',        icon:'🚫', label:'Not Moving Forward' },
  { id:'terminated', icon:'⛔', label:'Terminated / Removed' },
  { group: 'Admin' },
  { id:'checkcalls', icon:'☎️', label:'YOE & Check Calls' },
  { group: 'Reference' },
  { id:'policy', icon:'📖', label:'Policies & Pay (SOP)' },
];

/* ---------- State ---------- */

/* ---------- Helpers ---------- */
function age(dob){ if(!dob) return '—'; const d=new Date(dob); if(isNaN(d)) return '—'; const t=new Date(); let a=t.getFullYear()-d.getFullYear(); const m=t.getMonth()-d.getMonth(); if(m<0||(m===0&&t.getDate()<d.getDate())) a--; return a; }
function initials(d){ return ((d.firstName||'?')[0]||'').toUpperCase() + ((d.lastName||'')[0]||'').toUpperCase(); }
function fullName(d){ return (d.firstName||'') + ' ' + (d.lastName||''); }
function avatarColor(d){ let h=0; const s=d.id||fullName(d); for(let i=0;i<s.length;i++) h=s.charCodeAt(i)+((h<<5)-h); return AVATAR_COLORS[Math.abs(h)%AVATAR_COLORS.length]; }
function classMeta(name){ return CLASSIFICATIONS.find(c=>c.name===name) || {type:'',city:''}; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function fmtDate(s){ if(!s) return '—'; const d=new Date(s+'T00:00:00'); if(isNaN(d)) return esc(s); return d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}); }
function daysUntil(s){ if(!s) return null; const d=new Date(s+'T00:00:00'); if(isNaN(d)) return null; return Math.ceil((d-new Date().setHours(0,0,0,0))/86400000); }
function dueClass(days){ if(days==null) return 'ok'; if(days<0) return 'urgent'; if(days<=7) return 'soon'; return 'ok'; }
function activeDrivers(){ return drivers.filter(d=>!d.status || d.status==='Active'); }
function terminatedDrivers(){ return drivers.filter(d=>d.status==='Terminated'); }
function pipelineRecruits(){ return recruits.filter(r=>r.recruitStatus!=='nmf'); }
function nmfRecruits(){ return recruits.filter(r=>r.recruitStatus==='nmf'); }
function matchR(r){ if(!searchQ) return true; return (fullName(r)+' '+(r.position||'')+' '+(r.location||'')+' '+(r.phone||'')).toLowerCase().includes(searchQ); }
function activeLeads(){ return leads.filter(l=>l.status!=='Converted'); }
function matchL(l){ if(!searchQ) return true; return (fullName(l)+' '+(l.position||'')+' '+(l.phone||'')+' '+(l.email||'')).toLowerCase().includes(searchQ); }
function leadStatus(l){
  if(l.status==='Converted') return 'Converted';
  const att=l.attempts||[];
  if(att.some(a=>a.outcome==='Not Interested')) return 'Not Interested';
  if(att.some(a=>a.outcome==='Connected'||a.outcome==='Callback Requested')){ return l.interested ? 'Interested' : 'Contacted'; }
  const noAns=att.filter(a=>NO_ANSWER_OUTCOMES.includes(a.outcome)).length;
  if(noAns>=UNREACHABLE_AFTER) return 'Unreachable';
  if(att.length) return 'Attempting Contact';
  return 'New';
}
/* Admin/Safety helpers */
function yearsExp(d){ if(!d.cdlStartDate) return d.yoe!==''&&d.yoe!=null?Number(d.yoe):null; const s=new Date(d.cdlStartDate+'T00:00:00'); if(isNaN(s)) return null; return (Date.now()-s)/(365.25*86400000); }
function isUnderOneYear(d){ const y=yearsExp(d); return y!=null && y<1; }
function expYrsLabel(d){ const y=yearsExp(d); if(y==null) return '—'; return y<1 ? Math.round(y*12)+' mo' : y.toFixed(1)+' yr'; }
function dqfPercent(d){ const dq=d.dqf||{}; const verified=DQF_ITEMS.filter(it=>(dq[it]||{}).status==='Verified').length; return Math.round(verified/DQF_ITEMS.length*100); }
function dqfExpiringSoon(d){ const dq=d.dqf||{}; return DQF_ITEMS.some(it=>{ const x=(dq[it]||{}).expiration; if(!x) return false; const dd=daysUntil(x); return dd!=null && dd<=30; }); }
function nextMonthRemoval(dateStr){ if(!dateStr) return ''; const d=new Date(dateStr+'T00:00:00'); if(isNaN(d)) return ''; return new Date(d.getFullYear(), d.getMonth()+1, 1).toISOString().slice(0,10); }
function rsiStatus(d){ if(d.status==='Terminated'){ return d.insuranceRemovedDate ? 'Removed' : 'Pending Removal'; } return 'Active'; }
function rsiRemovalDate(d){ return d.insuranceRemovedDate || nextMonthRemoval(d.lastDateWorked); }
function pendingRemovalThisMonth(d){ if(rsiStatus(d)!=='Pending Removal') return false; const rd=rsiRemovalDate(d); if(!rd) return false; return rd.slice(0,7) <= new Date().toISOString().slice(0,7); }
function trainStatus(d, tId){ const t=(d.training||{})[tId]; if(!t||!t.status) return null; if(t.status!=='Completed' && t.dueDate){ const dd=daysUntil(t.dueDate); if(dd!=null && dd<0) return 'Overdue'; } return t.status; }
function insuredDrivers(){ return drivers.filter(d=>d.insuranceCarrier); }
function fileSize(b){ if(b<1024) return b+' B'; if(b<1048576) return (b/1024).toFixed(0)+' KB'; return (b/1048576).toFixed(1)+' MB'; }
function fileIcon(t){ if(!t) return '📄'; if(t.includes('pdf')) return '📕'; if(t.includes('image')) return '🖼️'; if(t.includes('sheet')||t.includes('excel')||t.includes('csv')) return '📊'; if(t.includes('word')||t.includes('doc')) return '📘'; return '📄'; }
function byName(a,b){ return fullName(a).localeCompare(fullName(b)); }

function avatar(d, size){ size=size||36; return `<div class="ava" style="width:${size}px;height:${size}px;background:${avatarColor(d)}">${esc(initials(d))}</div>`; }
function whoCell(d){ const c=classMeta(d.classification); return `<div class="who">${avatar(d)}<div><div class="nm">${esc(fullName(d))}</div><div class="sm">${esc(d.classification||'Unassigned')}${c.city?' · '+esc(d.city||c.city):''}</div></div></div>`; }
function availBadge(a){ return `<span class="badge ${AVAIL_STYLE[a]||'b-slate'}"><span style="font-size:7px">●</span>${esc(a||'—')}</span>`; }

function renderNav(){
  document.getElementById('nav').innerHTML = NAV.map(n=>{
    if(n.group) return `<div class="nav-group">${esc(n.group)}</div>`;
    let ct=''; const c=counts();
    if(n.id==='master') ct=c.active; else if(n.id==='timeoff') ct=c.timeoff; else if(n.id==='callouts') ct=c.callouts;
    else if(n.id==='pairings') ct=c.pairs; else if(n.id==='solo') ct=c.solo; else if(n.id==='returns') ct=c.returns;
    else if(n.id==='constraints') ct=c.constraints; else if(n.id==='roadtests') ct=c.roadtests;
    else if(n.id==='nmf') ct=c.nmf; else if(n.id==='terminated') ct=c.terminated;
    else if(n.id==='leads') ct=c.leads;
    else if(n.id==='checkcalls') ct=c.checkcalls;
    return `<div class="nav-item ${view===n.id?'active':''}" onclick="go('${n.id}')"><span class="ic">${n.icon}</span>${esc(n.label)}${ct!==''?`<span class="ct">${ct}</span>`:''}</div>`;
  }).join('');
}
function counts(){
  const a=activeDrivers();
  return {
    active:a.length,
    timeoff:a.reduce((s,d)=>s+(d.timeOff||[]).filter(t=>t.status!=='Denied').length,0),
    callouts:a.reduce((s,d)=>s+(d.callOuts||[]).length,0),
    pairs: Math.ceil(a.filter(d=>classMeta(d.classification).type==='team').length/2),
    solo:a.filter(d=>classMeta(d.classification).type==='solo').length,
    returns:a.filter(d=>d.returnDate).length,
    constraints:a.filter(d=>(d.constraints||[]).length).length,
    roadtests:pipelineRecruits().length,
    nmf:nmfRecruits().length,
    terminated:terminatedDrivers().length,
    leads:activeLeads().length,
    rsiPending:insuredDrivers().filter(d=>rsiStatus(d)==='Pending Removal').length,
    checkcalls:a.filter(isUnderOneYear).length,
    dqfIncomplete:a.filter(d=>dqfPercent(d)<100).length,
    violations:a.reduce((s,d)=>s+(d.violations||[]).filter(v=>v.status!=='Resolved').length,0),
  };
}

function vDash(){

  const dueSoon=a.filter(d=>{const dd=daysUntil(d.returnDate); return dd!=null&&dd<=7;}).sort((x,y)=>daysUntil(x.returnDate)-daysUntil(y.returnDate));

function vTimeoff(){

  const today=new Date().toISOString().slice(0,10);
  const upcoming=items.filter(({t})=>(t.end||t.start||'')>=today).sort((x,y)=>(x.t.start||'').localeCompare(y.t.start||''));
  const past=items.filter(({t})=>(t.end||t.start||'')<today).sort((x,y)=>(y.t.start||'').localeCompare(x.t.start||''));
  const stl={'Approved':'b-green','Pending':'b-amber','Denied':'b-red'};
  const tbl=(rows,empty)=>`<table><thead><tr><th>Driver</th><th>From</th><th>To</th><th>Reason</th><th>Status</th></tr></thead><tbody>${rows.length?rows.map(({d,t})=>`<tr onclick="openDriver('${d.id}')"><td>${whoCell(d)}</td><td>${fmtDate(t.start)}</td><td>${fmtDate(t.end)}</td><td>${esc(t.reason||'—')}</td><td><span class="badge ${stl[t.status]||'b-slate'}">${esc(t.status||'Pending')}</span></td></tr>`).join(''):`<tr><td colspan="5"><div class="empty" style="padding:24px"><p>${empty}</p></div></td></tr>`}</tbody></table>`;

function vPairings(){

  team.forEach(d=>{
    if(seen.has(d.id)) return;
    if(d.partnerId){ const p=drivers.find(x=>x.id===d.partnerId); if(p){ pairs.push([d,p]); seen.add(d.id); seen.add(p.id); return; } }

function setDQFByIdx(i,key,val){ const item=DQF_ITEMS[i]; draftDQF[item]=draftDQF[item]||{}; draftDQF[item][key]=val; if(key==='status') renderDQF(); updateDqfPct(); }
function updateDqfPct(){ const v=DQF_ITEMS.filter(it=>(draftDQF[it]||{}).status==='Verified').length; const el=document.getElementById('dqfPct'); if(el) el.innerHTML=bar(Math.round(v/DQF_ITEMS.length*100)); }
function renderDQF(){ const el=document.getElementById('dqfList'); if(!el) return; el.innerHTML=DQF_ITEMS.map((it,i)=>{const cur=draftDQF[it]||{};const exp=DQF_EXPIRES.includes(it);return `<div class="dqf-row"><span class="dqf-name">${esc(it)}${exp?' <span style="color:var(--red)">*</span>':''}</span><select onchange="setDQFByIdx(${i},'status',this.value)"><option value="" ${cur.status?'':'selected'}>—</option>${DQF_STATUS.map(s=>`<option ${cur.status===s?'selected':''}>${s}</option>`).join('')}</select><input type="date" value="${esc(cur.expiration)}" onchange="setDQFByIdx(${i},'expiration',this.value)" title="Expiration"></div>`;}).join(''); updateDqfPct(); }
function addViolation(){ const g=id=>document.getElementById(id); const date=g('v_date').value; if(!date){toast('Pick a violation date');return;} draftViolations.push({date,type:g('v_type').value.trim(),severity:g('v_sev').value,source:g('v_source').value.trim(),status:g('v_status').value,notes:g('v_notes').value.trim()}); g('v_date').value='';g('v_type').value='';g('v_source').value='';g('v_notes').value=''; renderViolations(); }
function renderViolations(){ const el=document.getElementById('violationList'); if(!el) return; el.innerHTML=draftViolations.map((v,i)=>`<div class="sub-item" style="align-items:flex-start"><div style="flex:1"><span class="badge ${VIO_SEV_STYLE[v.severity]||'b-slate'}">${esc(v.severity)}</span> <strong>${esc(v.type||'—')}</strong> <span style="color:var(--text2);font-size:11.5px">${fmtDate(v.date)}${v.source?' · '+esc(v.source):''} · ${esc(v.status)}</span>${v.notes?`<div style="font-size:12px;margin-top:3px">${esc(v.notes)}</div>`:''}</div><span class="si-x" onclick="draftViolations.splice(${i},1);renderViolations()">✕</span></div>`).join('') || '<div style="font-size:12.5px;color:var(--text2);padding:4px">No violations on record</div>'; }
function setTrain(id,key,val){ draftTraining[id]=draftTraining[id]||{}; draftTraining[id][key]=val; }
function renderTraining(){ const el=document.getElementById('trainingList'); if(!el) return; el.innerHTML = trainings.length? trainings.map(t=>{const cur=draftTraining[t.id]||{};const inp='padding:4px 8px;border-radius:7px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:12px';return `<div class="sub-item" style="flex-wrap:wrap;gap:8px"><span style="flex:1;min-width:150px">${esc(t.title)}</span><select onchange="setTrain('${t.id}','status',this.value)" style="${inp}"><option value="" ${cur.status?'':'selected'}>—</option><option ${cur.status==='Assigned'?'selected':''}>Assigned</option><option ${cur.status==='Completed'?'selected':''}>Completed</option></select><input type="date" title="Due date" value="${esc(cur.dueDate)}" onchange="setTrain('${t.id}','dueDate',this.value)" style="${inp}"><input type="date" title="Completed date" value="${esc(cur.completedDate)}" onchange="setTrain('${t.id}','completedDate',this.value)" style="${inp}"></div>`;}).join('') : '<div style="font-size:12.5px;color:var(--text2);padding:4px">No training topics in the catalog yet (add them in the Safety Training tab)</div>'; }
function addCheckCall(){ const g=id=>document.getElementById(id); const date=g('cc_date').value; if(!date){toast('Pick a date');return;} draftCheckCalls.push({date,caller:g('cc_caller').value.trim(),outcome:g('cc_outcome').value,notes:g('cc_notes').value.trim()}); g('cc_date').value='';g('cc_caller').value='';g('cc_notes').value=''; renderCheckCallsModal(); }
function renderCheckCallsModal(){ const el=document.getElementById('checkCallList'); if(!el) return; el.innerHTML=draftCheckCalls.slice().sort((a,b)=>(b.date||'').localeCompare(a.date||'')).map(c=>{const i=draftCheckCalls.indexOf(c);return `<div class="sub-item" style="align-items:flex-start"><div style="flex:1"><span class="badge ${CHECKCALL_STYLE[c.outcome]||'b-slate'}">${esc(c.outcome)}</span> <span style="color:var(--text2);font-size:11.5px">${fmtDate(c.date)}${c.caller?' · '+esc(c.caller):''}</span>${c.notes?`<div style="font-size:12px;margin-top:3px">${esc(c.notes)}</div>`:''}</div><span class="si-x" onclick="draftCheckCalls.splice(${i},1);renderCheckCallsModal()">✕</span></div>`;}).join('') || '<div style="font-size:12.5px;color:var(--text2);padding:4px">No check calls logged</div>'; }

function addConstraint(){ const i=document.getElementById('c_new'); const v=i.value.trim(); if(!v) return; draftConstraints.push(v); i.value=''; renderConstraints(); }
function renderConstraints(){ document.getElementById('constraintList').innerHTML=draftConstraints.map((c,i)=>`<div class="sub-item">⚠ ${esc(c)}<span class="si-x" onclick="draftConstraints.splice(${i},1);renderConstraints()">✕</span></div>`).join(''); }
function addTimeOff(){ const s=document.getElementById('to_start').value,e=document.getElementById('to_end').value,r=document.getElementById('to_reason').value.trim(); if(!s){toast('Pick a start date');return;} draftTimeOff.push({start:s,end:e||s,reason:r,status:'Pending'}); document.getElementById('to_start').value='';document.getElementById('to_end').value='';document.getElementById('to_reason').value=''; renderSubLists(); }
function addCallout(){ const dt=document.getElementById('co_date').value,r=document.getElementById('co_reason').value.trim(); if(!dt){toast('Pick a date');return;} draftCallouts.push({date:dt,reason:r}); document.getElementById('co_date').value='';document.getElementById('co_reason').value=''; renderSubLists(); }
function renderSubLists(){
  const stl={'Approved':'b-green','Pending':'b-amber','Denied':'b-red'};
  document.getElementById('timeoffList').innerHTML=draftTimeOff.map((t,i)=>`<div class="sub-item"><span>${fmtDate(t.start)} → ${fmtDate(t.end)} · ${esc(t.reason||'—')}</span><select onchange="draftTimeOff[${i}].status=this.value" style="margin-left:auto;padding:3px 6px;border-radius:7px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:11.5px">${['Pending','Approved','Denied'].map(s=>`<option ${t.status===s?'selected':''}>${s}</option>`).join('')}</select><span class="si-x" onclick="draftTimeOff.splice(${i},1);renderSubLists()">✕</span></div>`).join('');
  document.getElementById('calloutList').innerHTML=draftCallouts.map((c,i)=>`<div class="sub-item">📵 ${fmtDate(c.date)} · ${esc(c.reason||'—')}<span class="si-x" onclick="draftCallouts.splice(${i},1);renderSubLists()">✕</span></div>`).join('');
}
function renderDocs(){ document.getElementById('docList').innerHTML=draftDocs.map((f,i)=>`<div class="doc"><span class="fi">${fileIcon(f.type)}</span><span class="dn">${esc(f.name)}</span><span class="ds">${fileSize(f.size||0)}</span><a href="${f.url||f.dataUrl||'#'}" download="${esc(f.name)}" target="_blank" rel="noopener" title="Download">⬇</a><span class="rm" onclick="draftDocs.splice(${i},1);renderDocs()" title="Remove">✕</span></div>`).join('') || '<div style="font-size:12.5px;color:var(--text2);padding:4px">No documents uploaded</div>'; }
function onFiles(files){
  [...files].forEach(file=>{
    if(file.size>3*1048576){ toast(file.name+' is large (>3MB) — may not save'); }
    const r=new FileReader();
    r.onload=e=>{ draftDocs.push({name:file.name,type:file.type,size:file.size,dataUrl:e.target.result}); renderDocs(); };
    r.readAsDataURL(file);
  });
}
function saveDriver(){
  const g=id=>document.getElementById(id).value.trim();
  if(!g('f_first')||!g('f_last')){ toast('First and last name required'); return; }
  const cls=document.getElementById('f_class').value;
  const partner = classMeta(cls).type==='team' ? document.getElementById('f_partner').value : '';
  const rec={ firstName:g('f_first'), lastName:g('f_last'), dob:g('f_dob'), city:g('f_city'), email:g('f_email'),
    phone:g('f_phone'), yoe:g('f_yoe'), status:document.getElementById('f_status').value, classification:cls,
    availability:document.getElementById('f_avail').value, partnerId:partner, returnDate:g('f_return'),
    readyToGoDate:g('f_ready'), offDutySince:g('f_offduty'), followUpDate:g('f_followup'), availabilityReason:g('f_availreason'),
    notes:g('f_notes'), constraints:draftConstraints.slice(), timeOff:draftTimeOff.slice(),
    callOuts:draftCallouts.slice(), documents:draftDocs.slice(),
    lastDateWorked:g('f_lastday'), terminationType:document.getElementById('f_termtype').value,
    rehirable:document.getElementById('f_rehire').value, terminationReason:g('f_termreason'),
    insuranceCarrier:document.getElementById('f_carrier').value, cdlStartDate:g('f_cdlstart'), checkCallLead:g('f_calllead'),
    dqf:JSON.parse(JSON.stringify(draftDQF)), violations:draftViolations.slice(), training:JSON.parse(JSON.stringify(draftTraining)), checkCalls:draftCheckCalls.slice() };
  if(editId){ const d=drivers.find(x=>x.id===editId); const old=d.partnerId; Object.assign(d,rec);
    syncPartner(d, old);
  } else { rec.id=uid(); drivers.push(rec); syncPartner(rec, ''); }
  save(); closeModal(); renderNav(); render(); toast(editId?'Driver updated':'Driver added');
}
function syncPartner(d, oldPartner){
  if(oldPartner && oldPartner!==d.partnerId){ const o=drivers.find(x=>x.id===oldPartner); if(o&&o.partnerId===d.id) o.partnerId=''; }
  if(d.partnerId){ const p=drivers.find(x=>x.id===d.partnerId); if(p) p.partnerId=d.id; }
}
function deleteDriver(){ if(!confirm('Delete this driver permanently?')) return; const d=drivers.find(x=>x.id===editId); if(d&&d.partnerId){const p=drivers.find(x=>x.id===d.partnerId);if(p&&p.partnerId===d.id)p.partnerId='';} drivers=drivers.filter(x=>x.id!==editId); save(); closeModal(); renderNav(); render(); toast('Driver deleted'); }

const IMPORT_FIELDS=[['firstName','First Name'],['lastName','Last Name'],['fullName','Full Name (auto-split)'],['phone','Phone'],['email','Email'],['dob','Date of Birth'],['city','City'],['yoe','Years of Experience'],['classification','Classification / Position']];
let importParsed=null;
function openImport(){
  importParsed=null;
  const m=document.getElementById('modal');
  m.innerHTML=`<div class="modal-head"><h3>Import Drivers</h3><button class="x" onclick="closeModal()">✕</button></div>
  <div class="modal-body">
    <p style="font-size:13px;color:var(--text2);margin-bottom:12px">Upload a <strong>CSV or Excel</strong> file, or paste rows from Google Sheets / Excel. First row must be column headers. <a href="#" onclick="importTemplate();return false" style="color:var(--primary)">Download CSV template</a></p>
    <div class="fld full" style="margin-bottom:12px"><label>Upload file (.csv / .xlsx)</label><input type="file" id="imp_file" accept=".csv,.xlsx,.xls,.tsv,.txt" onchange="importFile(this.files[0])"></div>
    <div class="fld full"><label>…or paste here</label><textarea id="imp_paste" style="min-height:120px" placeholder="Paste rows including the header line"></textarea></div>
    <button class="btn btn-primary" style="margin-top:12px" onclick="importParseText()">Parse</button>
    <div id="imp_map"></div>
  </div>
  <div class="modal-foot" id="imp_foot"><button class="btn" onclick="closeModal()">Close</button></div>`;
  document.getElementById('overlay').classList.add('open');

function importTemplate(){
  const csv='firstName,lastName,phone,email,dob,city,yoe,classification\nJohn,Smith,(214) 555-0100,jsmith@email.com,1985-06-15,Dallas TX,8,Dallas HERO Teams\n';
  const a=document.createElement('a'); a.href='data:text/csv;charset=utf-8,'+encodeURIComponent(csv); a.download='driver_import_template.csv'; a.click();
}
function parseDelimited(text){
  text=text.replace(/\r\n/g,'\n').replace(/\r/g,'\n').replace(/\n+$/,''); if(!text.trim()) return null;
  const firstLine=text.split('\n')[0];
  const delim = (firstLine.split('\t').length>firstLine.split(',').length) ? '\t' : ',';
  const rows=[]; let row=[],cur='',q=false;
  for(let i=0;i<text.length;i++){ const ch=text[i];
    if(q){ if(ch==='"'){ if(text[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=ch; }
    else if(ch==='"') q=true;
    else if(ch===delim){ row.push(cur); cur=''; }
    else if(ch==='\n'){ row.push(cur); rows.push(row); row=[]; cur=''; }
    else cur+=ch; }
  row.push(cur); rows.push(row);
  const headers=(rows.shift()||[]).map(h=>String(h).trim());
  return { headers, rows: rows.filter(r=>r.some(c=>String(c).trim()!=='')) };
}
function importParseText(){ const t=document.getElementById('imp_paste').value; const p=parseDelimited(t); if(!p||!p.headers.length){ toast('Nothing to parse — paste rows or upload a file'); return; } importParsed=p; renderImportMapping(); }
function importFile(file){ if(!file) return;
  const name=file.name.toLowerCase();
  if(name.endsWith('.xlsx')||name.endsWith('.xls')){ ensureXLSX(()=>{ const r=new FileReader(); r.onload=e=>{ try{ const wb=XLSX.read(e.target.result,{type:'array'}); const csv=XLSX.utils.sheet_to_csv(wb.Sheets[wb.SheetNames[0]]); importParsed=parseDelimited(csv); renderImportMapping(); }catch(err){ toast('Could not read Excel file'); } }; r.readAsArrayBuffer(file); }); }
  else { const r=new FileReader(); r.onload=e=>{ importParsed=parseDelimited(e.target.result); if(importParsed) renderImportMapping(); else toast('Could not parse file'); }; r.readAsText(file); }
}
function ensureXLSX(cb){ if(window.XLSX) return cb(); const s=document.createElement('script'); s.src='https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js'; s.onload=cb; s.onerror=()=>toast('Could not load Excel library (offline?). Use CSV or paste instead.'); document.head.appendChild(s); }
function guessCol(headers, field){
  const h=headers.map(x=>x.toLowerCase().replace(/[^a-z]/g,''));
  const keys={firstName:['firstname','first','fname','givenname'],lastName:['lastname','last','lname','surname'],fullName:['name','drivername','fullname'],phone:['phone','cell','mobile','phonenumber','number'],email:['email','emailaddress'],dob:['dob','dateofbirth','birthdate','birthday'],city:['city','location','hometown'],yoe:['yoe','yearsofexperience','experience','years'],classification:['classification','position','program','role']}[field]||[];
  for(const k of keys){ const idx=h.indexOf(k); if(idx>-1) return headers[idx]; }
  for(const k of keys){ const idx=h.findIndex(x=>x.includes(k)); if(idx>-1) return headers[idx]; }
  return '';
}
function renderImportMapping(){
  const {headers,rows}=importParsed;
  const opts=sel=>`<option value="">(skip)</option>`+headers.map(h=>`<option ${h===sel?'selected':''}>${esc(h)}</option>`).join('');
  const map=IMPORT_FIELDS.map(([k,l])=>`<div class="fld"><label>${esc(l)}</label><select data-field="${k}">${opts(guessCol(headers,k))}</select></div>`).join('');
  document.getElementById('imp_map').innerHTML=`<div class="sec-label" style="border-top:1px solid var(--border)">Map your columns (${rows.length} rows found)</div>
    <div class="grid2">${map}</div>
    <div class="fld full" style="margin-top:12px"><label>Mode</label><select id="imp_mode"><option value="append">Add to existing drivers</option><option value="replace">Replace ALL drivers</option></select></div>`;
  document.getElementById('imp_foot').innerHTML=`<button class="btn" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="doImport()">Import ${rows.length} drivers</button>`;
}
function doImport(){
  const {headers,rows}=importParsed;
  const sel={}; document.querySelectorAll('#imp_map select[data-field]').forEach(s=>sel[s.dataset.field]=s.value?headers.indexOf(s.value):-1);
  const mode=document.getElementById('imp_mode').value;
  const val=(r,f)=> sel[f]>-1 ? String(r[sel[f]]||'').trim() : '';
  const matchCity=v=>{ const n=v.toLowerCase(); return CITIES.find(c=>n&&c.toLowerCase().includes(n.replace(/,?\s*(tx|tn)$/,'').trim()))||v; };
  const matchClass=v=>{ if(!v) return ''; const n=v.toLowerCase(); return POSITIONS.find(p=>p.toLowerCase()===n)||POSITIONS.find(p=>p.toLowerCase().includes(n)||n.includes(p.toLowerCase()))||v; };
  const built=rows.map(r=>{
    let fn=val(r,'firstName'), ln=val(r,'lastName');
    if(!fn&&!ln){ const full=val(r,'fullName'); const parts=full.split(/\s+/); fn=parts.shift()||''; ln=parts.join(' '); }
    return { id:uid(), firstName:fn, lastName:ln, phone:val(r,'phone'), email:val(r,'email'), dob:val(r,'dob'),
      city:matchCity(val(r,'city')), yoe:val(r,'yoe'), classification:matchClass(val(r,'classification')),
      status:'Active', availability:'Available', partnerId:'', returnDate:'', notes:'', constraints:[], timeOff:[], callOuts:[], documents:[] };
  }).filter(d=>d.firstName||d.lastName);
  if(!built.length){ toast('No valid rows — check your First/Last or Full Name mapping'); return; }
  if(mode==='replace'){ if(!confirm('Replace ALL '+drivers.length+' existing drivers with '+built.length+' imported?')) return; drivers=built; }
  else drivers=drivers.concat(built);
  save(); closeModal(); go('master'); toast('Imported '+built.length+' drivers');
}

let editMemoId=null, draftMemoEntries=[], draftMemoBlockers=[];
function openMemo(id){
  editMemoId=id;
  const mo = id ? pointsMemos.find(x=>x.id===id) : {month:new Date().toISOString().slice(0,7),status:'In Progress',entries:[],blockers:[]};
  draftMemoEntries=JSON.parse(JSON.stringify(mo.entries||[]));

  const names=activeDrivers().map(d=>fullName(d)).sort();
  const m=document.getElementById('modal');
  m.innerHTML=`<div class="modal-head"><h3>${id?'Edit Memo':'New Monthly Memo'}</h3><button class="x" onclick="closeModal()">✕</button></div>
  <div class="modal-body"><div class="grid2">
    <div class="fld"><label>Month</label><input id="mo_month" type="month" value="${esc(mo.month)}"></div>
    <div class="fld"><label>Status</label><select id="mo_status">${MEMO_STATUS.map(s=>`<option ${mo.status===s?'selected':''}>${s}</option>`).join('')}</select></div>
    <datalist id="driverNames">${names.map(n=>`<option value="${esc(n)}">`).join('')}</datalist>
    <div class="sec-label">Drivers Who Received Points</div>
    <div class="fld full"><div class="mini-add" style="grid-template-columns:1.4fr .6fr 1.4fr auto"><input id="me_driver" list="driverNames" placeholder="Driver"><input id="me_points" type="number" placeholder="Pts"><input id="me_violation" placeholder="Violation"><button class="btn" onclick="addMemoEntry()">Add</button></div><div class="sub-list" id="memoEntryList"></div></div>
    <div class="sec-label" style="color:var(--red)">Blockers (suspended CDL / invalid Med Card)</div>
    <div class="fld full"><div class="mini-add" style="grid-template-columns:1.3fr 1.1fr 1fr auto"><input id="mb_driver" list="driverNames" placeholder="Driver"><select id="mb_issue">${BLOCKER_ISSUES.map(b=>`<option>${b}</option>`).join('')}</select><input id="mb_notes" placeholder="Notes"><button class="btn" onclick="addMemoBlocker()">Add</button></div><div class="sub-list" id="memoBlockerList"></div></div>
  </div></div>
  <div class="modal-foot">${id?'<button class="btn btn-danger" onclick="deleteMemo()" style="margin-right:auto">Delete</button>':''}<button class="btn" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="saveMemo()">Save Memo</button></div>`;

}
function addMemoEntry(){ const d=document.getElementById('me_driver').value.trim(); if(!d){toast('Enter a driver');return;} draftMemoEntries.push({driver:d,points:document.getElementById('me_points').value||'0',violation:document.getElementById('me_violation').value.trim()}); document.getElementById('me_driver').value='';document.getElementById('me_points').value='';document.getElementById('me_violation').value=''; renderMemoEntries(); }
function renderMemoEntries(){ document.getElementById('memoEntryList').innerHTML=draftMemoEntries.map((e,i)=>`<div class="sub-item"><span><strong>${esc(e.driver)}</strong> · <span class="badge b-amber">${esc(e.points)} pts</span> · ${esc(e.violation||'—')}</span><span class="si-x" onclick="draftMemoEntries.splice(${i},1);renderMemoEntries()">✕</span></div>`).join('') || '<div style="font-size:12.5px;color:var(--text2);padding:4px">No entries</div>'; }
function addMemoBlocker(){ const d=document.getElementById('mb_driver').value.trim(); if(!d){toast('Enter a driver');return;} draftMemoBlockers.push({driver:d,issue:document.getElementById('mb_issue').value,status:'Open',notes:document.getElementById('mb_notes').value.trim()}); document.getElementById('mb_driver').value='';document.getElementById('mb_notes').value=''; renderMemoBlockers(); }
function renderMemoBlockers(){ document.getElementById('memoBlockerList').innerHTML=draftMemoBlockers.map((b,i)=>`<div class="sub-item"><span><strong>${esc(b.driver)}</strong> · ${esc(b.issue)}${b.notes?' · '+esc(b.notes):''}</span><select onchange="draftMemoBlockers[${i}].status=this.value" style="margin-left:auto;padding:3px 6px;border-radius:7px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:11.5px"><option ${b.status==='Open'?'selected':''}>Open</option><option ${b.status==='Resolved'?'selected':''}>Resolved</option></select><span class="si-x" onclick="draftMemoBlockers.splice(${i},1);renderMemoBlockers()">✕</span></div>`).join('') || '<div style="font-size:12.5px;color:var(--text2);padding:4px">No blockers</div>'; }
function saveMemo(){
  const month=document.getElementById('mo_month').value; if(!month){ toast('Pick a month'); return; }
  const rec={ month, status:document.getElementById('mo_status').value, entries:draftMemoEntries.slice(), blockers:draftMemoBlockers.slice() };
  if(editMemoId){ Object.assign(pointsMemos.find(x=>x.id===editMemoId), rec); }
  else { rec.id=uid(); pointsMemos.push(rec); }
  save(); closeModal(); render(); toast('Memo saved');
}
function deleteMemo(){ if(!confirm('Delete this memo?')) return; pointsMemos=pointsMemos.filter(x=>x.id!==editMemoId); save(); closeModal(); render(); toast('Memo deleted'); }

      {title:'8C. Missed Days & Pay Adjustment', body:'Routine doctor appointment (unavoidable mid-week): review with Sr. Ops; if confirmed unavoidable, convert week to CPM + payroll notation. Family emergency / last-minute call-out / no-call-no-show: convert to CPM if driver can start later in the week; if not available the entire week, no pay (notation still required). Notation must include driver name, date range, reason, and new pay basis.'},
      {title:'8D. Non-Local Driver Assignment (No Routes)', body:'When routes are unavailable due to dispatch/operational reasons, assign local work. Hero drivers keep their weekly minimum (company responsibility). Track consecutive local days in Master Dispatch. Day 5 = immediate escalation to Sr. Ops Manager (driver/terminal, reason, partner/route status). Written action plan before Day 6. Non-Hero drivers get $240/day if 12-hr minimum met.'},
      {title:'8E. Rookie Driver Program', body:'Rookies: <1 yr CDL at hire, Memphis only, paired with a 1+ yr driver, 6 days OTR + 34-hr reset. Pay difference vs experienced partner is by design. At the 1-year CDL mark (total CDL experience, not tenure) the rookie auto-qualifies for full pay; notify onboarding via Asset Ops Hiring TG and update comp records. Rookie on local with no partner = $240/day; weekly minimum doesn\'t apply until on team routes with a partner.'},
      {title:'8F. CPM-to-Hero Transition', body:'Confirm the CPM driver\'s interest and explain Hero requirements (6 days OTR, 34-hr reset, weekly guarantee not per-mile). Driver must verbally agree before any change. Post Asset Ops Hiring TG notice (name, current/new program, new rate, start date) and a Payroll Notation. Onboarding sends comp docs to sign — only after signed docs is the driver officially transferred. Proactively offer the transition if a CPM driver questions a pay gap with a Hero partner.'},
    ]
  };

  const trn=[{id:'tr1',title:'Defensive Driving 2026'},{id:'tr2',title:'Hours of Service Refresher'},{id:'tr3',title:'Hazmat Awareness'},{id:'tr4',title:'Winter Driving Safety'}];
  setf('Marcus',{training:{tr1:{status:'Completed',completedDate:'2026-03-10'},tr2:{status:'Assigned',dueDate:'2026-07-15'}}});
  setf('Carlos',{training:{tr1:{status:'Assigned',dueDate:'2026-06-01'},tr2:{status:'Completed',completedDate:'2026-05-20'}}});
  setf('Tasha',{training:{tr3:{status:'Assigned',dueDate:'2026-07-30'}}});
  setf('Sam',{training:{tr1:{status:'Assigned',dueDate:'2026-06-10'}}});

  const memos=[
    {id:uid(),month:'2026-06',status:'In Progress',entries:[{driver:'Carlos Reyes',points:'4',violation:'Speeding 11+ over'},{driver:'Tasha Green',points:'2',violation:'Late log certification'}],blockers:[{driver:'Mike Dawson',issue:'Invalid Med Card',status:'Open',notes:'Med card expired, awaiting new DOT physical'}]},
    {id:uid(),month:'2026-05',status:'Completed',entries:[{driver:'Carlos Reyes',points:'2',violation:'Hard braking'}],blockers:[]},
  ];

  return { drivers:arr, recruits:recs, leads:lds, policy:pol, pointsMemos:memos, trainings:trn };
}

/* ---------- Boot ---------- */
load(); renderNav(); render();
</script>
<script>
/* ================= Firebase Cloud Sync Layer =================
   Set FIREBASE_CONFIG to your project's web config to enable
   sign-in + shared cloud data. Leave as null for local-only mode. */
var FIREBASE_CONFIG = { "apiKey": "AIzaSyCEYIIVS7laNfVojGRNQ7PczcnIlq8Kf9Y", "authDomain": "ghlogistics-driver-hub.firebaseapp.com", "projectId": "ghlogistics-driver-hub", "storageBucket": "ghlogistics-driver-hub.firebasestorage.app", "messagingSenderId": "654302789423", "appId": "1:654302789423:web:40e0582d084ab555d9abda" };

/* Google sign-in must run on the SAME origin the app is served from, or the
   browser (Safari, and increasingly Chrome/Firefox) partitions storage between
   the app and the sign-in popup and the flow dies with "missing initial state".
   Firebase Hosting serves the auth handler on every hosting domain, so we point
   authDomain at whichever Firebase domain actually loaded the page, keeping the
   popup same-site whether someone opens the .firebaseapp.com or the .web.app URL.

   NOTE: Google's OAuth client for this project only trusts the .firebaseapp.com
   handler out of the box, so .firebaseapp.com is the canonical URL and the safe
   default. Loading from .web.app only works if
   https://ghlogistics-driver-hub.web.app/__/auth/handler is also added to the
   OAuth client's Authorized redirect URIs (Google Cloud console); otherwise it
   returns "Error 400: redirect_uri_mismatch". */
(function(){
  var h = (location.hostname || '').toLowerCase();
  if (/(\.web\.app|\.firebaseapp\.com)$/.test(h)) { FIREBASE_CONFIG.authDomain = h; }
})();

var fb = { app:null, db:null, user:null, ready:false, pushTimer:null, snap:{drivers:{},recruits:{},leads:{},meta:{}}, unsub:[] };

function save(){
  try { localStorage.setItem(KEY, JSON.stringify({drivers, recruits, leads, policy, pointsMemos, trainings})); }
  catch(e){ toast('Local cache full - large files may not save'); }
  if (fb.ready) fbSchedulePush();
}

function fbLoadSdk(cb){
  var urls=[
    'https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js',
    'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js',
    'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js',
    'https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js'
  ];
  var i=0;
  (function next(){
    if(i>=urls.length) return cb();
    var s=document.createElement('script'); s.src=urls[i++]; s.onload=next;
    s.onerror=function(){ toast('Could not load Firebase SDK'); };
    document.head.appendChild(s);
  })();
}

function fbGate(show, msg){
  var g=document.getElementById('fbGate');
  if(!g){
    g=document.createElement('div');
    g.id='fbGate';
    g.style.cssText='position:fixed;inset:0;background:var(--bg);z-index:5000;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:18px';
    g.innerHTML='<div style="width:56px;height:56px;border-radius:16px;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-size:28px">&#128666;</div>'+
      '<div style="font-size:20px;font-weight:700">GH Logistics Driver Hub</div>'+
      '<div id="fbGateMsg" style="font-size:13.5px;color:var(--text2);max-width:420px;text-align:center"></div>'+
      '<button class="btn btn-primary" id="fbGateBtn" onclick="fbSignIn()" style="padding:12px 22px;font-size:14px">Sign in with Google</button>';
    document.body.appendChild(g);
  }
  document.getElementById('fbGateMsg').textContent = msg || 'Sign in with your company Google account to continue.';
  g.style.display = show ? 'flex' : 'none';
}

function fbSignIn(){
  var provider=new firebase.auth.GoogleAuthProvider();
  firebase.auth().signInWithPopup(provider).catch(function(e){ fbGate(true,'Sign-in failed: '+e.message); });
}

function fbInit(){
  if(!FIREBASE_CONFIG) return; /* local-only mode */
  fbLoadSdk(function(){
    fb.app=firebase.initializeApp(FIREBASE_CONFIG);
    fb.db=firebase.firestore();
    try { fb.storage=firebase.storage(); } catch(e){ fb.storage=null; }
    fbGate(true);
    firebase.auth().onAuthStateChanged(function(u){
      if(!u){ fb.user=null; fb.ready=false; fbGate(true); return; }
      if(!/@(ghlogisticsllc|ajgtransport)\.com$/i.test(u.email||'')){
        firebase.auth().signOut();
        fbGate(true,'Access is limited to GH Logistics and AJG Transport accounts. Please sign in with your @ghlogisticsllc.com or @ajgtransport.com work email (you used '+u.email+').');
        return;
      }
      fb.user=u;
      fbBoot().catch(function(e){
        console.error(e);
        fbGate(true,'Could not load data for '+u.email+'. ('+e.message+')');
      });
    });
  });
}

function fbCol(name){ return fb.db.collection(name); }

async function fbBoot(){
  /* permission probe + bootstrap check */
  var boot = await fbCol('meta').doc('bootstrap').get();
  if(!boot.exists){
    await fbSeedAll();
    await fbCol('meta').doc('bootstrap').set({ seededAt:new Date().toISOString(), by:fb.user.email });
  } else {
    await fbPullAll();
  }
  fbListen();
  fb.ready=true;
  fbGate(false);
  renderNav(); render();
  toast('Signed in as '+fb.user.email);
}

function fbChunks(arr,n){ var out=[]; for(var i=0;i<arr.length;i+=n) out.push(arr.slice(i,i+n)); return out; }

async function fbSeedAll(){
  var cols={drivers:drivers, recruits:recruits, leads:leads};
  for(var name in cols){
    var batches=fbChunks(cols[name],400);
    for(var b=0;b<batches.length;b++){
      var batch=fb.db.batch();
      batches[b].forEach(function(rec){ batch.set(fbCol(name).doc(rec.id), JSON.parse(JSON.stringify(rec))); });
      await batch.commit();
    }
    var m={}; cols[name].forEach(function(r){ m[r.id]=JSON.stringify(r); }); fb.snap[name]=m;
  }
  await fbCol('meta').doc('policy').set({ json: JSON.stringify(policy) });
  await fbCol('meta').doc('pointsMemos').set({ json: JSON.stringify(pointsMemos) });
  await fbCol('meta').doc('trainings').set({ json: JSON.stringify(trainings) });
  fb.snap.meta={ policy:JSON.stringify(policy), pointsMemos:JSON.stringify(pointsMemos), trainings:JSON.stringify(trainings) };
}

async function fbPullAll(){
  var names=['drivers','recruits','leads'];
  for(var i=0;i<names.length;i++){
    var qs=await fbCol(names[i]).get();
    var arr=[]; var m={};
    qs.forEach(function(doc){ var d=doc.data(); d.id=doc.id; arr.push(d); m[doc.id]=JSON.stringify(d); });
    if(names[i]==='drivers') drivers=arr; else if(names[i]==='recruits') recruits=arr; else leads=arr;
    fb.snap[names[i]]=m;
  }
  var metaDocs=['policy','pointsMemos','trainings'];
  for(var j=0;j<metaDocs.length;j++){
    var md=await fbCol('meta').doc(metaDocs[j]).get();
    if(md.exists){
      var val=JSON.parse(md.data().json||'null');
      if(val!=null){ if(metaDocs[j]==='policy') policy=val; else if(metaDocs[j]==='pointsMemos') pointsMemos=val; else trainings=val; }
      fb.snap.meta[metaDocs[j]]=md.data().json;
    }
  }
  try { localStorage.setItem(KEY, JSON.stringify({drivers, recruits, leads, policy, pointsMemos, trainings})); } catch(e){}
}

function fbSchedulePush(){
  clearTimeout(fb.pushTimer);
  fb.pushTimer=setTimeout(function(){ fbPush().catch(function(e){ console.error(e); toast('Cloud sync failed - will retry on next change'); }); }, 900);
}

async function fbPush(){
  if(!fb.ready) return;
  var cols={drivers:drivers, recruits:recruits, leads:leads};
  for(var name in cols){
    var cur={}; cols[name].forEach(function(r){ cur[r.id]=JSON.stringify(r); });
    var writes=[];
    for(var id in cur){ if(fb.snap[name][id]!==cur[id]) writes.push({op:'set',id:id,data:JSON.parse(cur[id])}); }
    for(var oldId in fb.snap[name]){ if(!(oldId in cur)) writes.push({op:'del',id:oldId}); }
    var batches=fbChunks(writes,400);
    for(var b=0;b<batches.length;b++){
      var batch=fb.db.batch();
      batches[b].forEach(function(w){ w.op==='set' ? batch.set(fbCol(name).doc(w.id), w.data) : batch.delete(fbCol(name).doc(w.id)); });
      await batch.commit();
    }
    fb.snap[name]=cur;
  }
  var metas={policy:policy, pointsMemos:pointsMemos, trainings:trainings};
  for(var mName in metas){
    var js=JSON.stringify(metas[mName]);
    if(fb.snap.meta[mName]!==js){ await fbCol('meta').doc(mName).set({ json: js }); fb.snap.meta[mName]=js; }
  }
}

function fbModalOpen(){ var o=document.getElementById('overlay'); return o && o.classList.contains('open'); }

function fbListen(){
  fb.unsub.forEach(function(u){ u(); }); fb.unsub=[];
  ['drivers','recruits','leads'].forEach(function(name){
    fb.unsub.push(fbCol(name).onSnapshot(function(qs){
      if(!fb.ready) return;
      var arr=[]; var m={};
      qs.forEach(function(doc){ var d=doc.data(); d.id=doc.id; arr.push(d); m[doc.id]=JSON.stringify(d); });
      var changed = JSON.stringify(Object.keys(m).sort())!==JSON.stringify(Object.keys(fb.snap[name]).sort()) ||
        Object.keys(m).some(function(k){ return m[k]!==fb.snap[name][k]; });
      if(!changed) return;
      if(name==='drivers') drivers=arr; else if(name==='recruits') recruits=arr; else leads=arr;
      fb.snap[name]=m;
      try { localStorage.setItem(KEY, JSON.stringify({drivers, recruits, leads, policy, pointsMemos, trainings})); } catch(e){}
      if(!fbModalOpen()){ renderNav(); render(); }
    }));
  });
  fb.unsub.push(fbCol('meta').onSnapshot(function(qs){
    if(!fb.ready) return;
    var dirty=false;
    qs.forEach(function(doc){
      if(['policy','pointsMemos','trainings'].indexOf(doc.id)<0) return;
      var js=doc.data().json;
      if(fb.snap.meta[doc.id]===js) return;
      var val=JSON.parse(js||'null'); if(val==null) return;
      if(doc.id==='policy') policy=val; else if(doc.id==='pointsMemos') pointsMemos=val; else trainings=val;
      fb.snap.meta[doc.id]=js; dirty=true;
    });
    if(dirty && !fbModalOpen()){ renderNav(); render(); }
  }));
}

/* Cloud mode: upload documents to Firebase Storage and store only a link
   (keeps Firestore records under the 1MB limit and supports large files). */
var _origOnFiles = onFiles;
onFiles = function(files){
  var storage = null;
  try { storage = fb.storage || (window.firebase && firebase.storage && firebase.storage()); } catch(e){ storage = null; }
  /* Fall back to inline base64 when not signed in / storage unavailable */
  if(!FIREBASE_CONFIG || !fb.user || !storage){ return _origOnFiles(files); }
  [].forEach.call(files, function(file){
    if(file.size > 25*1048576){ toast(file.name+' is too large (max 25MB)'); return; }
    var safe = String(file.name).replace(/[^\w.\-]+/g,'_');
    var path = 'driverDocs/'+Date.now()+'_'+Math.random().toString(36).slice(2,8)+'_'+safe;
    toast('Uploading '+file.name+'…');
    storage.ref().child(path).put(file).then(function(snap){
      return snap.ref.getDownloadURL();
    }).then(function(url){
      draftDocs.push({ name:file.name, type:file.type, size:file.size, url:url, path:path });
      renderDocs();
      toast(file.name+' uploaded');
    }).catch(function(e){
      console.error(e);
      var code = e && e.code;
      var msg = code==='storage/unauthorized' ? 'blocked by Storage security rules'
              : code==='storage/unknown'      ? 'cloud file storage may not be enabled for this project'
              : (e && e.message ? e.message : 'upload failed');
      toast(file.name+': '+msg);
    });
  });
};

fbInit();
</script>
